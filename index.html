<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetSen | Nền tảng dịch vụ thú cưng</title>
<style>
:root{--green:#16865f;--green2:#0e6b4b;--mint:#eaf7ef;--bg:#f6faf7;--ink:#20352c;--muted:#718078;--line:#e1ebe4;--white:#fff;--orange:#f3b64a;--red:#c74f4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Arial,Helvetica,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:#fff;font-weight:700}button:hover{background:var(--green2)}button.secondary{background:#fff;color:var(--green);border:1px solid #cfe3d6}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red);border:1px solid #f2caca}button.small{padding:6px 9px;font-size:12px}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:12px}.wrap{max-width:1180px;margin:auto;padding:0 22px}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;font-weight:900;color:var(--green);letter-spacing:-1px;cursor:pointer}.brand span{color:#273d31}.navlinks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.navlinks button{background:transparent;color:#43564a;font-weight:600;padding:9px}.navlinks button:hover{background:var(--mint)}.userchip{border-radius:99px;background:var(--mint);color:var(--green2);padding:7px 12px;font-size:13px;font-weight:700}.page{padding:28px 0 60px;min-height:calc(100vh - 130px)}.hero{background:linear-gradient(110deg,#e7f6eb,#f4fbf4);border:1px solid #dceee0;border-radius:22px;padding:30px;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;overflow:hidden}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:11px}.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.12;margin:10px 0 12px;letter-spacing:-1.5px}.hero p{color:#5e7165;max-width:560px}.hero-art{font-size:100px;text-align:center;filter:drop-shadow(0 8px 8px #b8d7bd)}.searchbar{display:flex;gap:8px;margin-top:20px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:14px;max-width:670px}.searchbar input{flex:1;border:0;outline:0;min-width:0;padding:8px}.searchbar select{border:0;border-left:1px solid var(--line);padding:8px;color:#526258}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 14px}.sectionhead h2{margin:0;font-size:23px}.sectionhead p{margin:3px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #24452e08}.cardbody{padding:17px}.serviceimg{height:145px;display:grid;place-items:center;background:linear-gradient(135deg,#e5f5e9,#f9f4e7);font-size:66px}.card h3{margin:0 0 7px;font-size:17px}.price{font-weight:800;color:var(--green);font-size:18px}.tag{display:inline-flex;border-radius:99px;padding:4px 9px;background:var(--mint);color:var(--green2);font-size:11px;font-weight:800}.stars{color:#d89a20}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:18px}.panel h2,.panel h3{margin-top:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#44584b}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e5dc;border-radius:10px;padding:11px 12px;background:#fff;outline-color:#8ac7a3}.field textarea{min-height:88px;resize:vertical}.hint{font-size:12px;color:#7c8a80;margin-top:-2px}.authbox{max-width:850px;margin:10px auto;display:grid;grid-template-columns:.8fr 1.2fr;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.authside{background:linear-gradient(160deg,#e1f4e6,#f7fbf3);padding:32px;display:flex;flex-direction:column;justify-content:center}.authside .petemoji{font-size:90px;text-align:center}.authmain{padding:30px}.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line)}.tabs button{border-radius:8px 8px 0 0;background:transparent;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--green);border-bottom-color:var(--green)}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f4e3b9;color:#775c1d;border-radius:12px;font-size:13px;margin:12px 0}.success{background:#eef9f0;border-color:#cce8d1;color:#286b43}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.step{font-size:12px;padding:8px 11px;border-radius:99px;background:#edf1ed;color:#728077}.step.active{background:var(--green);color:#fff}.dash{display:grid;grid-template-columns:220px 1fr;gap:18px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;height:max-content}.sidebar h3{padding:0 10px}.sidebar button{display:block;width:100%;text-align:left;background:transparent;color:#526258;margin:3px 0;font-weight:600}.sidebar button.active,.sidebar button:hover{background:var(--mint);color:var(--green2)}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);padding:17px;border-radius:14px}.stat strong{display:block;font-size:25px;color:var(--green)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f6faf7;color:#5d6e63}.status{padding:4px 8px;border-radius:99px;background:#eef8f0;color:#28784b;font-size:11px;font-weight:800}.status.wait{background:#fff4dc;color:#946a11}.status.no{background:#fff0f0;color:#a33d3d}.petphoto{width:86px;height:86px;border-radius:14px;background:var(--mint);display:grid;place-items:center;font-size:45px;overflow:hidden}.petphoto img,.previewimg{width:100%;height:100%;object-fit:cover}.petrow{display:flex;gap:14px;align-items:center}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbdacf;border-radius:14px}.footer{padding:22px;text-align:center;color:#7b8a80;border-top:1px solid var(--line);font-size:12px}.toast{position:fixed;bottom:20px;right:20px;z-index:50;background:#20352c;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 25px #0002;max-width:340px}.detailhero{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detailart{background:linear-gradient(140deg,#e2f4e7,#fff3df);border-radius:16px;min-height:250px;display:grid;place-items:center;font-size:120px}.divider{height:1px;background:var(--line);margin:17px 0}
@media(max-width:800px){.hero,.authbox,.detailhero{grid-template-columns:1fr}.hero-art{font-size:70px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:4px}.sidebar h3{display:none}.sidebar button{white-space:nowrap;width:auto}.statgrid{grid-template-columns:1fr}.nav{height:auto;padding:12px 0;align-items:flex-start;flex-direction:column}.navlinks{gap:2px}.formgrid{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:0 13px}.grid,.grid.two{grid-template-columns:1fr}.hero{padding:22px}.authmain,.authside{padding:22px}.page{padding-top:18px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap nav"><div class="brand" onclick="goHome()">🐾 Pet<span>Sen</span></div><nav class="navlinks" id="navlinks"><button onclick="goHome()">Trang chủ</button><button onclick="showPage('services')">Dịch vụ</button><button onclick="showPage('partners')">Đối tác</button><button onclick="showPage('blog')">Blog</button><button onclick="showPage('login')">Đăng nhập</button><button onclick="showPage('register')">Đăng ký</button></nav><div id="userchip"></div></div></header>
<main class="wrap page" id="app"></main>
<footer class="footer">PetSen · Kết nối chủ nuôi với cơ sở dịch vụ thú cưng · Bản demo giao diện</footer>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
let currentUser=null, currentRole=null, activePartnerTab='overview', activeAdminTab='approvals', authMode='login', bookingService=null;
let users=JSON.parse(localStorage.getItem('petsen_users')||'[]');
let partners=JSON.parse(localStorage.getItem('petsen_partners')||'[]');
let pets=JSON.parse(localStorage.getItem('petsen_pets')||'[]');
let services=JSON.parse(localStorage.getItem('petsen_services')||'null')||[
{id:1,partner:'PetCare Spa',category:'Spa & Grooming',name:'Gói tắm và vệ sinh cơ bản',price:150000,duration:60,emoji:'🛁',description:'Tắm, sấy, vệ sinh tai và chăm sóc cơ bản cho thú cưng.',address:'Cầu Giấy, Hà Nội',rating:4.9,approved:true},
{id:2,partner:'Happy Vet',category:'Khám chữa bệnh',name:'Khám tổng quát',price:200000,duration:45,emoji:'🩺',description:'Kiểm tra sức khỏe tổng quát và tư vấn chăm sóc.',address:'Đống Đa, Hà Nội',rating:4.8,approved:true},
{id:3,partner:'Puppy Hotel',category:'Trông giữ',name:'Trông giữ thú cưng trong ngày',price:250000,duration:480,emoji:'🏡',description:'Không gian lưu trú sạch sẽ, có người theo dõi.',address:'Thanh Xuân, Hà Nội',rating:4.7,approved:true},
{id:4,partner:'Dog Trainer',category:'Huấn luyện',name:'Huấn luyện căn bản',price:300000,duration:60,emoji:'🎾',description:'Làm quen với các lệnh cơ bản và hành vi tích cực.',address:'Hai Bà Trưng, Hà Nội',rating:4.8,approved:true},
{id:5,partner:'PetRide',category:'Đưa đón',name:'Đưa đón thú cưng nội thành',price:100000,duration:30,emoji:'🚗',description:'Đưa đón thú cưng theo lịch hẹn trong nội thành.',address:'Hà Nội',rating:4.6,approved:true}
];
let bookings=JSON.parse(localStorage.getItem('petsen_bookings')||'[]');
let reviews=JSON.parse(localStorage.getItem('petsen_reviews')||'[]');
function persist(){localStorage.setItem('petsen_users',JSON.stringify(users));localStorage.setItem('petsen_partners',JSON.stringify(partners));localStorage.setItem('petsen_pets',JSON.stringify(pets));localStorage.setItem('petsen_services',JSON.stringify(services));localStorage.setItem('petsen_bookings',JSON.stringify(bookings));localStorage.setItem('petsen_reviews',JSON.stringify(reviews))}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
function setHeader(){let n=$('#userchip');n.innerHTML=currentUser?`<span class="userchip">${currentRole==='partner'?'🏪':'🐾'} ${esc(currentUser.name)} · ${currentRole==='partner'?'Đối tác':currentRole==='admin'?'Admin':'Khách hàng'}</span> <button class="small secondary" onclick="logout()">Đăng xuất</button>`:''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(page){setHeader();const app=$('#app');if(page==='home')return renderHome();if(page==='services')return renderServices();if(page==='partners')return renderPartners();if(page==='blog')return renderBlog();if(page==='register')return renderRegister();if(page==='login')return renderLogin();if(page==='role')return renderRole();if(page==='partnerApply')return renderPartnerApply();if(page==='pending')return renderPending();if(page==='customer')return renderCustomer();if(page==='pets')return renderPets();if(page==='petForm')return renderPetForm();if(page==='serviceDetail')return renderServiceDetail();if(page==='booking')return renderBooking();if(page==='myBookings')return renderMyBookings();if(page==='partner')return renderPartnerDashboard();if(page==='admin')return renderAdmin();if(page==='checkout')return renderCheckout();if(page==='review')return renderReview();app.innerHTML='<div class="empty">Không tìm thấy trang.</div>'}
function goHome(){if(currentRole==='partner')showPage('partner');else if(currentRole==='admin')showPage('admin');else showPage('home')}
function logout(){currentUser=null;currentRole=null;setHeader();showPage('home');toast('Bạn đã đăng xuất.')}
function renderHome(){setHeader();$('#app').innerHTML=`
<section class="hero"><div><div class="eyebrow">PetSen · Chăm sóc bằng yêu thương</div><h1>Chăm sóc thú cưng<br> dễ dàng hơn mỗi ngày</h1><p>Tìm kiếm dịch vụ phù hợp, đặt lịch nhanh chóng và quản lý hồ sơ sức khỏe của người bạn bốn chân trên cùng một nền tảng.</p><div class="searchbar"><input id="homeSearch" placeholder="Tìm dịch vụ, cơ sở, địa điểm..." onkeydown="if(event.key==='Enter')searchFromHome()"><select id="homeCat"><option value="">Tất cả danh mục</option><option>Spa & Grooming</option><option>Khám chữa bệnh</option><option>Trông giữ</option><option>Huấn luyện</option><option>Đưa đón</option></select><button onclick="searchFromHome()">Tìm kiếm</button></div><div class="actions"><button class="secondary" onclick="showPage('pets')">🐾 Hồ sơ thú cưng</button><button class="secondary" onclick="showPage('myBookings')">📅 Lịch của tôi</button></div></div><div class="hero-art">🐕‍🦺 🐈</div></section>
<div class="sectionhead"><div><h2>Khám phá dịch vụ</h2><p>Lựa chọn dịch vụ chăm sóc cho thú cưng của bạn</p></div><button class="secondary" onclick="showPage('services')">Xem tất cả →</button></div><div class="grid">${[['🛁','Spa & Grooming'],['🩺','Khám chữa bệnh'],['🏡','Trông giữ'],['🎾','Huấn luyện'],['🚗','Đưa đón'],['✨','Dịch vụ khác']].map(x=>`<div class="card"><div class="cardbody row"><div style="font-size:32px">${x[0]}</div><div style="flex:1"><b>${x[1]}</b><div class="muted tiny">Tìm cơ sở phù hợp</div></div><button class="small secondary" onclick="filterCategory('${x[1]}')">Khám phá</button></div></div>`).join('')}</div>
<div class="sectionhead"><div><h2>Đối tác nổi bật</h2><p>Các cơ sở được giới thiệu trên PetSen</p></div><button class="secondary" onclick="showPage('partners')">Xem thêm →</button></div><div class="grid">${services.filter(s=>s.approved).slice(0,3).map(serviceCard).join('')}</div>`}
function searchFromHome(){let q=$('#homeSearch').value;let c=$('#homeCat').value;renderServices(q,c)}
function filterCategory(c){renderServices('',c==='Dịch vụ khác'?'':c)}
function serviceCard(s){return `<article class="card"><div class="serviceimg">${s.emoji||'🐾'}</div><div class="cardbody"><div class="row between"><span class="tag">${esc(s.category)}</span><span class="stars">★ ${s.rating||'4.8'}</span></div><h3 style="margin-top:10px">${esc(s.name)}</h3><div class="muted tiny">🏪 ${esc(s.partner)} · 📍 ${esc(s.address||'Hà Nội')}</div><p class="muted tiny">${esc(s.description||'Dịch vụ chăm sóc thú cưng.')}</p><div class="row between"><span class="price">${money(s.price)}</span><button onclick="openService(${s.id})">Xem chi tiết</button></div></div></article>`}
function renderServices(q='',cat=''){setHeader();let list=services.filter(s=>s.approved&&(!cat||s.category===cat)&&(!q||(s.name+' '+s.partner+' '+s.category+' '+s.address).toLowerCase().includes(q.toLowerCase())));$('#app').innerHTML=`<div class="sectionhead"><div><h1>Dịch vụ thú cưng</h1><p>Tìm kiếm theo tên dịch vụ, danh mục hoặc cơ sở.</p></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Từ khóa</label><input id="serviceQ" value="${esc(q)}" placeholder="Ví dụ: tắm, khám, Cầu Giấy"></div><div class="field"><label>Danh mục</label><select id="serviceCat"><option value="">Tất cả danh mục</option>${['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện','Đưa đón'].map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="actions"><button onclick="renderServices($('#serviceQ').value,$('#serviceCat').value)">Tìm kiếm</button><button class="secondary" onclick="renderServices()">Xóa bộ lọc</button></div></div><div class="grid">${list.map(serviceCard).join('')||'<div class="empty">Chưa tìm thấy dịch vụ phù hợp.</div>'}</div>`}
function renderPartners(){setHeader();let names=[...new Set(services.filter(s=>s.approved).map(s=>s.partner))];$('#app').innerHTML=`<div class="sectionhead"><div><h1>Cơ sở đối tác</h1><p>Thông tin cơ sở cung cấp dịch vụ trên PetSen.</p></div></div><div class="grid">${names.map((n,i)=>`<div class="card"><div class="serviceimg">${['🏡','🏥','🛁','🎾'][i%4]}</div><div class="cardbody"><h3>${esc(n)}</h3><div class="stars">★ ${(4.6+i%4/10).toFixed(1)}</div><p class="muted tiny">${esc(services.find(s=>s.partner===n)?.address||'Hà Nội')}</p><button onclick="renderServices('${esc(n)}')">Xem dịch vụ</button></div></div>`).join('')}</div>`}
function renderBlog(){setHeader();$('#app').innerHTML=`<div class="sectionhead"><div><h1>Góc chăm sóc thú cưng</h1><p>Thông tin tham khảo dành cho chủ nuôi.</p></div></div><div class="grid">${[['🩺','Lịch tiêm phòng cho chó mèo','Lưu lại ngày tiêm và hỏi ý kiến bác sĩ thú y về lịch nhắc phù hợp.'],['🥣','Dinh dưỡng hằng ngày','Chọn khẩu phần phù hợp với loài, độ tuổi, cân nặng và tình trạng sức khỏe.'],['🧼','Chăm sóc lông và vệ sinh','Duy trì thói quen vệ sinh an toàn, phù hợp với từng giống thú cưng.']].map(a=>`<div class="card"><div class="serviceimg">${a[0]}</div><div class="cardbody"><h3>${a[1]}</h3><p class="muted">${a[2]}</p></div></div>`).join('')}</div><div class="notice">Nội dung chỉ mang tính tham khảo, không thay thế chẩn đoán hoặc tư vấn của bác sĩ thú y.</div>`}
function renderRegister(){authMode='register';setHeader();$('#app').innerHTML=`<div class="authbox"><div class="authside"><div class="eyebrow">Chào mừng đến với PetSen</div><h2>Chăm sóc tốt hơn, kết nối dễ dàng hơn.</h2><p>Nền tảng dành cho người nuôi thú cưng và các cơ sở dịch vụ.</p><div class="petemoji">🐕 🐈</div></div><div class="authmain"><div class="tabs"><button class="active">Đăng ký</button><button onclick="showPage('login')">Đăng nhập</button></div><h2>Tạo tài khoản PetSen</h2><form onsubmit="registerUser(event)"><div class="formgrid"><div class="field full"><label>Họ và tên / Người đại diện</label><input name="name" required placeholder="Nhập họ tên"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="name@email.com"></div><div class="field"><label>Số điện thoại</label><input name="phone" required pattern="[0-9+ ]{9,16}" placeholder="09xxxxxxxx"></div><div class="field full"><label>Mật khẩu</label><input name="password" type="password" minlength="6" required placeholder="Ít nhất 6 ký tự"></div></div><div class="notice">Sau khi tạo tài khoản, bạn sẽ chọn vai trò Khách hàng hoặc Đối tác ở bước tiếp theo.</div><button type="submit" style="width:100%">Tạo tài khoản & chọn vai trò</button></form><p class="muted tiny">Bản demo: xác thực email/OTP thực tế chưa được kết nối.</p></div></div>`}
function registerUser(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase();if(users.some(u=>u.email===email)){toast('Email đã được đăng ký. Hãy đăng nhập.');return}let u={id:Date.now(),name:f.get('name'),email,phone:f.get('phone'),password:f.get('password'),role:null};users.push(u);persist();currentUser=u;showPage('role')}
function renderRole(){setHeader();$('#app').innerHTML=`<div style="max-width:800px;margin:auto;text-align:center"><div class="eyebrow">Bước tiếp theo</div><h1>Chọn vai trò của bạn</h1><p class="muted">PetSen sẽ thiết lập giao diện và công cụ phù hợp với mục đích sử dụng.</p><div class="grid two" style="margin-top:28px"><div class="card"><div class="serviceimg">🐾</div><div class="cardbody"><h2>Khách hàng</h2><p class="muted">Tìm dịch vụ, quản lý hồ sơ thú cưng, đặt lịch và đánh giá cơ sở.</p><button style="width:100%" onclick="chooseRole('customer')">Tiếp tục với vai trò khách hàng</button></div></div><div class="card"><div class="serviceimg">🏪</div><div class="cardbody"><h2>Đối tác dịch vụ</h2><p class="muted">Đăng ký cơ sở, gửi minh chứng để kiểm duyệt và quản lý dịch vụ.</p><button style="width:100%" onclick="chooseRole('partner')">Đăng ký làm đối tác</button></div></div></div></div>`}
function chooseRole(role){if(!currentUser){showPage('register');return}currentUser.role=role;users=users.map(u=>u.id===currentUser.id?currentUser:u);persist();if(role==='partner')showPage('partnerApply');else{currentRole='customer';showPage('home');toast('Tài khoản khách hàng đã sẵn sàng.')}} 
function renderPartnerApply(){setHeader();$('#app').innerHTML=`<div class="sectionhead"><div><h1>Đăng ký cơ sở đối tác</h1><p>Hoàn thiện hồ sơ và gửi quản trị viên kiểm duyệt trước khi vận hành.</p></div><span class="tag">Hồ sơ đối tác</span></div><div class="steps"><span class="step active">1. Thông tin đại diện</span><span class="step active">2. Thông tin cơ sở</span><span class="step active">3. Minh chứng</span><span class="step">4. Kiểm duyệt</span></div><form class="panel" onsubmit="submitPartner(event)"><div class="formgrid"><div class="field"><label>Tên cơ sở</label><input name="business" required placeholder="Ví dụ: PetCare Spa"></div><div class="field"><label>Loại hình dịch vụ</label><select name="category" required><option value="">Chọn danh mục</option><option>Spa & Grooming</option><option>Khám chữa bệnh</option><option>Trông giữ</option><option>Huấn luyện</option><option>Đưa đón</option></select></div><div class="field"><label>Người đại diện</label><input name="representative" required value="${esc(currentUser?.name||'')}"></div><div class="field"><label>Số điện thoại liên hệ</label><input name="phone" required value="${esc(currentUser?.phone||'')}"></div><div class="field full"><label>Địa chỉ cơ sở</label><input name="address" required placeholder="Số nhà, đường, quận/huyện, tỉnh/thành"></div><div class="field full"><label>Mô tả cơ sở và dịch vụ</label><textarea name="description" required placeholder="Giới thiệu năng lực, quy trình chăm sóc, thời gian hoạt động..."></textarea></div><div class="field"><label>Mã số doanh nghiệp / giấy phép (nếu có)</label><input name="license" placeholder="Nhập mã hoặc thông tin giấy phép"></div><div class="field"><label>Ảnh/logo cơ sở</label><input name="photo" type="file" accept="image/*" onchange="previewFile(this,'partnerPreview')"><div id="partnerPreview"></div></div><div class="field full"><label>Tải minh chứng (giấy phép, chứng chỉ, ảnh cơ sở)</label><input name="proof" type="file" accept="image/*,.pdf" multiple><span class="hint">Bản demo chỉ lưu thông tin hồ sơ; tệp chưa được tải lên máy chủ.</span></div></div><div class="notice">Sau khi gửi, trạng thái sẽ là “Chờ duyệt”. Trong bản demo, tài khoản đối tác chỉ vào trang quản lý sau khi Admin phê duyệt.</div><div class="actions"><button type="submit">Gửi hồ sơ kiểm duyệt</button><button type="button" class="secondary" onclick="showPage('role')">Quay lại chọn vai trò</button></div></form>`}
function submitPartner(e){e.preventDefault();let f=new FormData(e.target);let p={id:Date.now(),userId:currentUser.id,business:f.get('business'),category:f.get('category'),representative:f.get('representative'),phone:f.get('phone'),address:f.get('address'),description:f.get('description'),license:f.get('license'),status:'pending',created:new Date().toISOString()};partners.push(p);currentUser.role='partner';users=users.map(u=>u.id===currentUser.id?currentUser:u);persist();showPage('pending')}
function renderPending(){setHeader();let p=partners.find(x=>x.userId===currentUser?.id);$('#app').innerHTML=`<div class="panel" style="max-width:760px;margin:30px auto;text-align:center;padding:36px"><div style="font-size:64px">📨</div><span class="tag">Hồ sơ đối tác</span><h1>Hồ sơ đã được gửi</h1><p class="muted">Cơ sở <b>${esc(p?.business||'')}</b> đang ở trạng thái <b>${p?.status==='approved'?'Đã phê duyệt':p?.status==='rejected'?'Yêu cầu bổ sung / từ chối':'Chờ Admin kiểm duyệt'}</b>.</p><p>Trong thời gian chờ, bạn có thể đăng xuất. Khi hồ sơ được phê duyệt, hãy đăng nhập lại để sử dụng trang quản lý đối tác.</p><div class="actions" style="justify-content:center"><button onclick="showPage('login')">Đến đăng nhập</button><button class="secondary" onclick="showPage('admin')">Mở trang kiểm duyệt demo</button></div><p class="muted tiny">Trang kiểm duyệt demo không có bảo mật quản trị trong phiên bản HTML này.</p></div>`}
function renderLogin(){authMode='login';setHeader();$('#app').innerHTML=`<div class="authbox"><div class="authside"><div class="eyebrow">PetSen</div><h2>Chào mừng bạn quay trở lại!</h2><p>Nền tảng chăm sóc thú cưng toàn diện.</p><div class="petemoji">🐕‍🦺 🐈</div></div><div class="authmain"><div class="tabs"><button onclick="showPage('login')" class="active">Đăng nhập</button><button onclick="showPage('register')">Đăng ký</button></div><h2>Đăng nhập</h2><form onsubmit="loginUser(event)"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="name@email.com"></div><div class="field" style="margin-top:13px"><label>Mật khẩu</label><input name="password" type="password" required placeholder="Nhập mật khẩu"></div><div class="actions"><button type="submit" style="flex:1">Đăng nhập</button></div></form><div class="divider"></div><p class="muted tiny">Demo Admin: <b>admin@petsen.vn</b> / <b>PetSen123</b></p><p class="muted tiny">Đăng nhập Google/Facebook và OTP chưa được kết nối trong bản demo.</p></div></div>`}
function loginUser(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),pass=f.get('password');if(email==='admin@petsen.vn'&&pass==='PetSen123'){currentUser={id:0,name:'Quản trị viên',email};currentRole='admin';showPage('admin');return}let u=users.find(x=>x.email===email&&x.password===pass);if(!u){toast('Thông tin đăng nhập chưa đúng.');return}currentUser=u;if(u.role==='partner'){let p=partners.find(x=>x.userId===u.id);if(p?.status==='approved'){currentRole='partner';showPage('partner')}else{currentRole=null;showPage('pending')}}else if(!u.role){showPage('role')}else{currentRole='customer';showPage('home')}}
function renderCustomer(){showPage('home')}
function renderPets(){setHeader();if(!currentUser){$('#app').innerHTML=`<div class="empty"><h2>Đăng nhập để quản lý hồ sơ thú cưng</h2><button onclick="showPage('login')">Đăng nhập</button></div>`;return}let list=pets.filter(p=>p.userId===currentUser.id);$('#app').innerHTML=`<div class="sectionhead"><div><h1>Hồ sơ thú cưng thông minh</h1><p>Lưu thông tin cơ bản, ảnh, tình trạng sức khỏe và lịch sử chăm sóc.</p></div><button onclick="showPage('petForm')">＋ Thêm thú cưng</button></div>${list.length?`<div class="grid">${list.map(p=>`<div class="card"><div class="cardbody"><div class="petrow"><div class="petphoto">${p.image?`<img src="${p.image}" alt="Ảnh ${esc(p.name)}">`:'🐾'}</div><div><h3>${esc(p.name)}</h3><div class="muted tiny">${esc(p.species)} · ${esc(p.breed||'Chưa rõ giống')}</div><div class="muted tiny">${esc(p.age||'Chưa rõ tuổi')} · ${esc(p.weight||'Chưa rõ cân nặng')}</div></div></div><div class="divider"></div><b>Tình trạng sức khỏe</b><p class="muted tiny">${esc(p.health||'Chưa cập nhật')}</p><b>Lịch sử chăm sóc</b><p class="muted tiny">${(p.records||[]).map(r=>esc(r.type)+' — '+esc(r.date||r.relative||'Chưa ghi ngày')).join('<br>')||'Chưa có ghi chú'}</p><div class="actions"><button class="secondary" onclick="editPet(${p.id})">Chỉnh sửa</button><button class="danger small" onclick="deletePet(${p.id})">Xóa</button></div></div></div>`).join('')}</div>`:'<div class="empty"><div style="font-size:48px">🐶</div><h3>Chưa có hồ sơ thú cưng</h3><p>Thêm hồ sơ để đặt lịch nhanh hơn và lưu thông tin sức khỏe.</p><button onclick="showPage(\\'petForm\\')">Tạo hồ sơ đầu tiên</button></div>'}`}
let editingPet=null;
function renderPetForm(){setHeader();if(!currentUser){showPage('login');return}let p=editingPet||{};$('#app').innerHTML=`<div class="sectionhead"><div><h1>${p.id?'Cập nhật':'Tạo'} hồ sơ thú cưng</h1><p>Các thông tin có gợi ý để bạn điền nhanh. Chỉ chia sẻ thông tin sức khỏe cần thiết cho việc chăm sóc.</p></div></div><div class="steps"><span class="step active">1. Thông tin cơ bản</span><span class="step active">2. Sức khỏe</span><span class="step active">3. Lịch sử chăm sóc</span></div><form class="panel" onsubmit="savePet(event)"><div class="formgrid"><div class="field"><label>Tên thú cưng *</label><input name="name" required value="${esc(p.name||'')}" placeholder="Ví dụ: Miu, Bông, Đậu"></div><div class="field"><label>Loài *</label><select name="species" required><option value="">Chọn loài</option>${['Chó','Mèo','Thỏ','Hamster','Chim','Khác'].map(x=>`<option ${p.species===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Giống</label><input name="breed" value="${esc(p.breed||'')}" placeholder="Ví dụ: Poodle, mèo Anh lông ngắn"></div><div class="field"><label>Ngày sinh hoặc tuổi</label><input name="age" value="${esc(p.age||'')}" placeholder="Ví dụ: 2 tuổi hoặc 12/05/2023"><span class="hint">Có thể nhập tuổi ước tính nếu không biết ngày sinh.</span></div><div class="field"><label>Cân nặng (kg)</label><input name="weight" type="number" min="0" step=".1" value="${esc(p.weight||'')}" placeholder="Ví dụ: 4.5"></div><div class="field"><label>Giới tính</label><select name="sex"><option value="">Chưa xác định</option><option ${p.sex==='Đực'?'selected':''}>Đực</option><option ${p.sex==='Cái'?'selected':''}>Cái</option></select></div><div class="field"><label>Ảnh thú cưng</label><input name="image" type="file" accept="image/*" onchange="previewFile(this,'petPreview')"><div id="petPreview">${p.image?`<img class="previewimg" style="width:100px;height:100px;border-radius:12px" src="${p.image}">`:''}</div><span class="hint">Ảnh demo được lưu trong trình duyệt; nên dùng ảnh nhỏ.</span></div><div class="field"><label>Tính cách / lưu ý khi tiếp xúc</label><input name="temperament" value="${esc(p.temperament||'')}" placeholder="Ví dụ: nhút nhát, sợ tiếng ồn, thân thiện"></div><div class="field full"><label>Bệnh lý / tình trạng sức khỏe hiện tại</label><textarea name="health" placeholder="Ví dụ: dị ứng thức ăn, đang dùng thuốc, từng phẫu thuật...">${esc(p.health||'')}</textarea><span class="hint">Gợi ý: dị ứng, bệnh nền, thuốc đang dùng, hạn chế vận động, dấu hiệu cần lưu ý.</span></div><div class="field full"><label>Ghi chú chăm sóc / lịch sử sức khỏe</label><div id="records">${(p.records||[]).map(recordRow).join('')}</div><button type="button" class="secondary" onclick="addRecord()">＋ Thêm lần chăm sóc / tiêm phòng</button><span class="hint">Có thể chọn ngày cụ thể hoặc ghi tương đối, ví dụ “khoảng 2 tháng trước”.</span></div></div><div class="actions"><button type="submit">Lưu hồ sơ</button><button type="button" class="secondary" onclick="editingPet=null;showPage('pets')">Hủy</button></div></form>`}
function recordRow(r={}){return `<div class="panel" style="padding:12px;margin:10px 0"><div class="formgrid"><div class="field"><label>Loại ghi chú</label><input class="rec-type" value="${esc(r.type||'')}" placeholder="Ví dụ: Đã tiêm phòng"></div><div class="field"><label>Ngày thực hiện cụ thể</label><input class="rec-date" type="date" value="${esc(r.date||'')}"></div><div class="field full"><label>Hoặc thời gian tương đối / chi tiết</label><input class="rec-relative" value="${esc(r.relative||'')}" placeholder="Ví dụ: khoảng 2 tháng trước; vaccine dại"></div></div><button type="button" class="danger small" onclick="this.parentElement.remove()">Xóa ghi chú</button></div>`}
function addRecord(){let d=document.createElement('div');d.innerHTML=recordRow({});$('#records').appendChild(d.firstElementChild)}
function savePet(e){e.preventDefault();let f=new FormData(e.target),records=[...document.querySelectorAll('#records .panel')].map(x=>({type:x.querySelector('.rec-type').value,date:x.querySelector('.rec-date').value,relative:x.querySelector('.rec-relative').value})).filter(r=>r.type||r.date||r.relative);let old=editingPet;let p={id:old?.id||Date.now(),userId:currentUser.id,name:f.get('name'),species:f.get('species'),breed:f.get('breed'),age:f.get('age'),weight:f.get('weight'),sex:f.get('sex'),temperament:f.get('temperament'),health:f.get('health'),records,image:old?.image||''};let file=f.get('image');if(file&&file.size){if(file.size>900000){toast('Ảnh hơi lớn. Hãy chọn ảnh dưới 900 KB trong bản demo.');return}let rd=new FileReader();rd.onload=()=>{p.image=rd.result;storePet(p,old)};rd.readAsDataURL(file)}else storePet(p,old)}
function storePet(p,old){if(old)pets=pets.map(x=>x.id===old.id?p:x);else pets.push(p);persist();editingPet=null;showPage('pets');toast('Đã lưu hồ sơ thú cưng.')}
function editPet(id){editingPet=pets.find(p=>p.id===id);showPage('petForm')}
function deletePet(id){if(confirm('Bạn có chắc muốn xóa hồ sơ này?')){pets=pets.filter(p=>p.id!==id);persist();showPage('pets')}}
function previewFile(input,id){let file=input.files?.[0],el=$('#'+id);if(!file||!el)return;if(file.size>900000){toast('Vui lòng chọn ảnh nhỏ hơn 900 KB.');input.value='';return}let rd=new FileReader();rd.onload=()=>el.innerHTML=`<img class="previewimg" style="width:100px;height:100px;border-radius:12px" src="${rd.result}" alt="Ảnh xem trước">`;rd.readAsDataURL(file)}
let selectedService=null;
function openService(id){selectedService=services.find(s=>s.id===id);showPage('serviceDetail')}
function renderServiceDetail(){setHeader();let s=selectedService;if(!s){showPage('services');return}$('#app').innerHTML=`<div class="actions"><button class="ghost" onclick="showPage('services')">← Quay lại danh sách</button></div><div class="panel detailhero"><div class="detailart">${s.emoji||'🐾'}</div><div><span class="tag">${esc(s.category)}</span><h1>${esc(s.name)}</h1><div class="stars">★ ${s.rating||'4.8'} <span class="muted tiny">(Đánh giá từ khách hàng)</span></div><p class="muted">🏪 ${esc(s.partner)}<br>📍 ${esc(s.address||'Hà Nội')}<br>⏱ ${s.duration||60} phút</p><div class="price">Từ ${money(s.price)}</div><p>${esc(s.description||'Dịch vụ chăm sóc thú cưng.')}</p><div class="notice">Hãy kiểm tra kỹ thông tin cơ sở và chọn đúng hồ sơ thú cưng trước khi xác nhận đặt lịch.</div><div class="actions"><button onclick="startBooking()">Đặt lịch ngay</button><button class="secondary" onclick="toast('Tính năng nhắn tin sẽ cần backend để hoạt động.')">Chat với cửa hàng</button></div></div></div><div class="sectionhead"><div><h2>Đánh giá dịch vụ</h2><p>Phản hồi từ khách hàng sau khi hoàn thành giao dịch.</p></div></div><div class="panel">${reviews.filter(r=>r.serviceId===s.id&&r.approved).map(r=>`<p><b>${esc(r.name)}</b> <span class="stars">${'★'.repeat(r.stars)}</span><br>${esc(r.text)}</p>`).join('')||'<p class="muted">Chưa có đánh giá được duyệt.</p>'}</div>`}
function startBooking(){if(!currentUser){showPage('login');toast('Đăng nhập trước khi đặt lịch nhé.');return}if(currentRole!=='customer'){toast('Hãy đăng nhập bằng tài khoản khách hàng để đặt lịch.');return}bookingService=selectedService;showPage('booking')}
function renderBooking(){setHeader();if(!currentUser||currentRole!=='customer'){showPage('login');return}let s=bookingService;if(!s){showPage('services');return}let ps=pets.filter(p=>p.userId===currentUser.id);$('#app').innerHTML=`<div class="sectionhead"><div><h1>Đặt lịch dịch vụ</h1><p>Thực hiện lần lượt từng bước, kiểm tra thông tin trước khi thanh toán.</p></div></div><div class="steps"><span class="step active">1. Chọn dịch vụ</span><span class="step active">2. Chọn thú cưng</span><span class="step active">3. Chọn thời gian</span><span class="step">4. Xác nhận</span></div><div class="panel"><div class="row"><div style="font-size:50px">${s.emoji||'🐾'}</div><div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.partner)} · ${money(s.price)} · ${s.duration||60} phút</p></div></div><div class="divider"></div><form onsubmit="continueCheckout(event)"><div class="formgrid"><div class="field"><label>Hồ sơ thú cưng *</label><select name="petId" required>${ps.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.species)}</option>`).join('')}</select></div><div class="field"><label>Hình thức tiếp nhận</label><select name="method"><option>Đến trực tiếp cơ sở</option><option>Đưa đón tận nơi</option></select></div><div class="field"><label>Ngày hẹn *</label><input name="date" type="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Khung giờ *</label><select name="time" required><option value="">Chọn giờ</option>${['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field full"><label>Ghi chú cho cơ sở</label><textarea name="note" placeholder="Tình trạng sức khỏe hoặc yêu cầu đặc biệt..."></textarea></div></div>${ps.length?'':'<div class="notice">Bạn chưa có hồ sơ thú cưng. Hãy tạo hồ sơ trước khi đặt lịch.</div>'}<div class="actions"><button type="submit" ${ps.length?'':'disabled'}>Tiếp tục xác nhận →</button><button type="button" class="secondary" onclick="renderServiceDetail()">Quay lại</button></div></form></div>`}
function continueCheckout(e){e.preventDefault();let f=new FormData(e.target);let p=pets.find(x=>x.id===Number(f.get('petId')));let b={id:Date.now(),customerId:currentUser.id,customerName:currentUser.name,serviceId:bookingService.id,serviceName:bookingService.name,partner:bookingService.partner,partnerId:partners.find(x=>x.business===bookingService.partner)?.userId||null,petId:p.id,petName:p.name,method:f.get('method'),date:f.get('date'),time:f.get('time'),note:f.get('note'),price:bookingService.price,status:'Chờ thanh toán',created:new Date().toISOString()};window.pendingBooking=b;showPage('checkout')}
function renderCheckout(){setHeader();let b=window.pendingBooking;if(!b){showPage('myBookings');return}$('#app').innerHTML=`<div class="sectionhead"><div><h1>Xác nhận và thanh toán</h1><p>Bước cuối trước khi gửi yêu cầu đặt dịch vụ.</p></div></div><div class="panel" style="max-width:760px;margin:auto"><div class="steps"><span class="step active">1. Dịch vụ</span><span class="step active">2. Lịch hẹn</span><span class="step active">3. Thanh toán</span></div><h2>Thông tin đặt lịch</h2><div class="tablewrap"><table><tr><th>Dịch vụ</th><td>${esc(b.serviceName)}</td></tr><tr><th>Cơ sở</th><td>${esc(b.partner)}</td></tr><tr><th>Thú cưng</th><td>${esc(b.petName)}</td></tr><tr><th>Ngày, giờ</th><td>${esc(b.date)} · ${esc(b.time)}</td></tr><tr><th>Hình thức</th><td>${esc(b.method)}</td></tr><tr><th>Tạm tính</th><td><b>${money(b.price)}</b></td></tr></table></div><div class="field" style="margin-top:18px"><label>Phương thức thanh toán (demo)</label><select id="paymethod"><option>Ví điện tử (mô phỏng)</option><option>Thẻ ngân hàng (mô phỏng)</option><option>Thẻ thanh toán ảo (mô phỏng)</option><option>Thanh toán tại cơ sở</option></select></div><div class="notice">Đây là bản demo giao diện: không thu tiền thật, không kết nối cổng thanh toán. Trong hệ thống thực tế cần tích hợp nhà cung cấp thanh toán và cơ chế đối soát.</div><div class="actions"><button onclick="confirmBooking()">Xác nhận đặt lịch</button><button class="secondary" onclick="showPage('booking')">Quay lại</button></div></div>`}
function confirmBooking(){let b=window.pendingBooking;if(!b)return;b.status='Đã đặt lịch';b.payment=$('#paymethod').value;bookings.push(b);persist();window.pendingBooking=null;showPage('myBookings');toast('Đặt lịch demo thành công!')}
function renderMyBookings(){setHeader();if(!currentUser){$('#app').innerHTML='<div class="empty"><h2>Đăng nhập để xem lịch</h2><button onclick="showPage(\\'login\\')">Đăng nhập</button></div>';return}let list=bookings.filter(b=>b.customerId===currentUser.id);$('#app').innerHTML=`<div class="sectionhead"><div><h1>Lịch đặt dịch vụ của tôi</h1><p>Theo dõi trạng thái các lịch hẹn đã đặt.</p></div><button onclick="showPage('services')">＋ Đặt dịch vụ</button></div>${list.length?`<div class="panel tablewrap"><table><thead><tr><th>Mã đơn</th><th>Dịch vụ</th><th>Thú cưng</th><th>Ngày giờ</th><th>Thanh toán</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${list.map(b=>`<tr><td>#${b.id.toString().slice(-6)}</td><td>${esc(b.serviceName)}<div class="muted tiny">${esc(b.partner)}</div></td><td>${esc(b.petName)}</td><td>${esc(b.date)} ${esc(b.time)}</td><td>${money(b.price)}</td><td><span class="status">${esc(b.status)}</span></td><td>${b.status==='Hoàn thành'?`<button class="small" onclick="startReview(${b.id})">Đánh giá</button>`:`<button class="small secondary" onclick="customerComplete(${b.id})">Đã hoàn thành</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>Bạn chưa có lịch hẹn nào</h3><button onclick="showPage(\\'services\\')">Tìm dịch vụ</button></div>'}`}
function customerComplete(id){let b=bookings.find(x=>x.id===id);if(b){b.status='Hoàn thành';persist();showPage('myBookings');toast('Đã cập nhật trạng thái hoàn thành.')} }
let reviewBookingId=null;
function startReview(id){reviewBookingId=id;showPage('review')}
function renderReview(){setHeader();let b=bookings.find(x=>x.id===reviewBookingId);if(!b){showPage('myBookings');return}$('#app').innerHTML=`<div class="panel" style="max-width:650px;margin:auto"><h1>Đánh giá dịch vụ</h1><p>${esc(b.serviceName)} · ${esc(b.partner)}</p><form onsubmit="submitReview(event)"><div class="field"><label>Số sao</label><select name="stars"><option value="5">★★★★★ — Rất hài lòng</option><option value="4">★★★★ — Hài lòng</option><option value="3">★★★ — Bình thường</option><option value="2">★★ — Chưa hài lòng</option><option value="1">★ — Không hài lòng</option></select></div><div class="field" style="margin-top:12px"><label>Nội dung phản hồi</label><textarea name="text" required placeholder="Chia sẻ trải nghiệm thực tế của bạn..."></textarea></div><div class="field" style="margin-top:12px"><label>Ảnh minh họa (tùy chọn)</label><input type="file" accept="image/*"></div><div class="notice">Đánh giá sẽ ở trạng thái chờ kiểm duyệt trước khi hiển thị công khai.</div><div class="actions"><button>Gửi đánh giá</button><button type="button" class="secondary" onclick="showPage('myBookings')">Hủy</button></div></form></div>`}
function submitReview(e){e.preventDefault();let f=new FormData(e.target),b=bookings.find(x=>x.id===reviewBookingId);reviews.push({id:Date.now(),serviceId:b.serviceId,bookingId:b.id,name:currentUser.name,stars:Number(f.get('stars')),text:f.get('text'),approved:false});persist();showPage('myBookings');toast('Đã gửi đánh giá, chờ Admin kiểm duyệt.')}
function renderPartnerDashboard(){setHeader();let p=partners.find(x=>x.userId===currentUser?.id&&x.status==='approved');if(!p){showPage('pending');return}let mine=services.filter(s=>s.partner===p.business),orders=bookings.filter(b=>b.partner===p.business);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Cổng đối tác</div><h1>${esc(p.business)}</h1><p>${esc(p.address)} · <span class="status">Đã xác minh</span></p></div><button onclick="partnerTab('services')">＋ Thêm dịch vụ</button></div><div class="dash"><aside class="sidebar"><h3>Quản lý cơ sở</h3><button class="${activePartnerTab==='overview'?'active':''}" onclick="partnerTab('overview')">⌂ Tổng quan</button><button class="${activePartnerTab==='profile'?'active':''}" onclick="partnerTab('profile')">▣ Hồ sơ gian hàng</button><button class="${activePartnerTab==='services'?'active':''}" onclick="partnerTab('services')">✚ Quản lý dịch vụ</button><button class="${activePartnerTab==='hours'?'active':''}" onclick="partnerTab('hours')">◷ Giờ hoạt động</button><button class="${activePartnerTab==='orders'?'active':''}" onclick="partnerTab('orders')">▤ Lịch hẹn & đơn hàng</button><button class="${activePartnerTab==='revenue'?'active':''}" onclick="partnerTab('revenue')">$ Doanh thu</button><button class="${activePartnerTab==='reviews'?'active':''}" onclick="partnerTab('reviews')">☆ Đánh giá</button><button onclick="showPage('pets')">Hồ sơ thú cưng (xem hướng dẫn)</button></aside><section>${partnerPanel(p,mine,orders)}</section></div>`}
function partnerTab(t){activePartnerTab=t;renderPartnerDashboard()}
function partnerPanel(p,mine,orders){if(activePartnerTab==='overview')return `<div class="statgrid"><div class="stat"><span class="muted tiny">Dịch vụ đang niêm yết</span><strong>${mine.length}</strong></div><div class="stat"><span class="muted tiny">Lịch hẹn</span><strong>${orders.length}</strong></div><div class="stat"><span class="muted tiny">Doanh thu tạm tính</span><strong>${money(orders.filter(b=>b.status==='Hoàn thành').reduce((a,b)=>a+b.price*.8,0))}</strong></div></div><div class="panel" style="margin-top:16px"><h2>Xin chào, ${esc(p.representative)}</h2><p class="muted">Quản lý dịch vụ, cập nhật lịch hoạt động và theo dõi các đơn đặt dịch vụ tại đây.</p><div class="notice">PetSen demo giả lập mức chiết khấu nền tảng 20%; chưa có thanh toán hoặc giải ngân thật.</div></div><div class="panel"><h3>Đơn đặt gần đây</h3>${orders.slice(-5).map(b=>`<p>• ${esc(b.serviceName)} — ${esc(b.date)} ${esc(b.time)} · <span class="status">${esc(b.status)}</span></p>`).join('')||'<p class="muted">Chưa có đơn đặt.</p>'}</div>`;
if(activePartnerTab==='profile')return `<div class="panel"><h2>Hồ sơ gian hàng</h2><p><b>Tên cơ sở:</b> ${esc(p.business)}</p><p><b>Danh mục:</b> ${esc(p.category)}</p><p><b>Địa chỉ:</b> ${esc(p.address)}</p><p><b>Điện thoại:</b> ${esc(p.phone)}</p><p><b>Mô tả:</b> ${esc(p.description)}</p><button class="secondary" onclick="toast('Chỉnh sửa hồ sơ sẽ được bổ sung ở phiên bản tiếp theo.')">Chỉnh sửa hồ sơ</button></div>`;
if(activePartnerTab==='services')return `<div class="panel"><div class="row between"><h2>Quản lý dịch vụ</h2><button onclick="newService()">＋ Thêm dịch vụ</button></div><div class="tablewrap"><table><tr><th>Tên dịch vụ</th><th>Danh mục</th><th>Giá</th><th>Thời lượng</th><th>Trạng thái</th><th>Thao tác</th></tr>${mine.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.category)}</td><td>${money(s.price)}</td><td>${s.duration} phút</td><td><span class="status">Đang hoạt động</span></td><td><button class="small danger" onclick="removeService(${s.id})">Xóa</button></td></tr>`).join('')}</table></div><div id="serviceForm"></div></div>`;
if(activePartnerTab==='hours')return `<div class="panel"><h2>Thiết lập khung giờ hoạt động</h2><form onsubmit="saveHours(event)"><div class="formgrid"><div class="field"><label>Ngày hoạt động</label><select name="days" multiple size="4"><option>Thứ 2</option><option>Thứ 3</option><option>Thứ 4</option><option>Thứ 5</option><option>Thứ 6</option><option>Thứ 7</option><option>Chủ nhật</option></select><span class="hint">Giữ Ctrl để chọn nhiều ngày.</span></div><div><div class="field"><label>Giờ mở cửa</label><input type="time" name="open" value="08:00"></div><div class="field" style="margin-top:10px"><label>Giờ đóng cửa</label><input type="time" name="close" value="20:00"></div><div class="field" style="margin-top:10px"><label>Số thú cưng tối đa mỗi khung giờ</label><input type="number" name="capacity" min="1" value="5"></div></div></div><button style="margin-top:14px">Lưu lịch hoạt động</button></form><div class="notice">Cấu hình này là bản demo trên trình duyệt; chưa chặn lịch trùng tự động.</div></div>`;
if(activePartnerTab==='orders')return `<div class="panel"><h2>Lịch hẹn & đơn hàng</h2><div class="tablewrap"><table><tr><th>Mã đơn</th><th>Khách hàng</th><th>Thú cưng</th><th>Dịch vụ</th><th>Thời gian</th><th>Trạng thái</th><th>Cập nhật</th></tr>${orders.map(b=>`<tr><td>#${b.id.toString().slice(-6)}</td><td>${esc(b.customerName)}</td><td>${esc(b.petName)}</td><td>${esc(b.serviceName)}</td><td>${esc(b.date)} ${esc(b.time)}</td><td>${esc(b.status)}</td><td><select onchange="updateOrder(${b.id},this.value)"><option ${b.status==='Đã đặt lịch'?'selected':''}>Đã đặt lịch</option><option ${b.status==='Đã xác nhận'?'selected':''}>Đã xác nhận</option><option ${b.status==='Đang phục vụ'?'selected':''}>Đang phục vụ</option><option ${b.status==='Hoàn thành'?'selected':''}>Hoàn thành</option><option ${b.status==='Đã hủy'?'selected':''}>Đã hủy</option></select></td></tr>`).join('')||'<tr><td colspan="7">Chưa có đơn hàng.</td></tr>'}</table></div></div>`;
if(activePartnerTab==='revenue'){let gross=orders.filter(b=>b.status==='Hoàn thành').reduce((a,b)=>a+b.price,0);return `<div class="panel"><h2>Theo dõi doanh thu</h2><div class="statgrid"><div class="stat"><span class="muted tiny">Tổng giá trị dịch vụ</span><strong>${money(gross)}</strong></div><div class="stat"><span class="muted tiny">Chiết khấu PetSen (20%)</span><strong>${money(gross*.2)}</strong></div><div class="stat"><span class="muted tiny">Đối tác nhận (80%)</span><strong>${money(gross*.8)}</strong></div></div><div class="notice">Số liệu minh họa dựa trên đơn đã hoàn thành, không phải số dư thực tế và chưa có chức năng rút tiền.</div></div>`}
if(activePartnerTab==='reviews')return `<div class="panel"><h2>Đánh giá dịch vụ</h2>${reviews.filter(r=>mine.some(s=>s.id===r.serviceId)).map(r=>`<p><b>${esc(r.name)}</b> · ${'★'.repeat(r.stars)}<br>${esc(r.text)} · ${r.approved?'Đã duyệt':'Đang chờ duyệt'}</p>`).join('')||'<p class="muted">Chưa có đánh giá.</p>'}</div>`}
function newService(){let el=$('#serviceForm');if(!el)return;el.innerHTML=`<div class="divider"></div><h3>Thêm dịch vụ mới</h3><form onsubmit="saveService(event)"><div class="formgrid"><div class="field"><label>Tên dịch vụ</label><input name="name" required></div><div class="field"><label>Danh mục</label><select name="category"><option>Spa & Grooming</option><option>Khám chữa bệnh</option><option>Trông giữ</option><option>Huấn luyện</option><option>Đưa đón</option></select></div><div class="field"><label>Giá niêm yết (VNĐ)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Thời lượng (phút)</label><input name="duration" type="number" min="1" value="60" required></div><div class="field full"><label>Mô tả</label><textarea name="description" required></textarea></div></div><div class="actions"><button>Lưu dịch vụ</button><button type="button" class="secondary" onclick="$('#serviceForm').innerHTML=''">Hủy</button></div></form>`}
function saveService(e){e.preventDefault();let p=partners.find(x=>x.userId===currentUser.id),f=new FormData(e.target);services.push({id:Date.now(),partner:p.business,category:f.get('category'),name:f.get('name'),price:Number(f.get('price')),duration:Number(f.get('duration')),emoji:'🐾',description:f.get('description'),address:p.address,rating:5,approved:true});persist();renderPartnerDashboard();toast('Đã thêm dịch vụ.')}
function removeService(id){if(confirm('Xóa dịch vụ này?')){services=services.filter(s=>s.id!==id);persist();renderPartnerDashboard()}}
function updateOrder(id,status){let b=bookings.find(x=>x.id===id);if(b){b.status=status;persist();toast('Đã cập nhật trạng thái đơn.');renderPartnerDashboard()}}
function saveHours(e){e.preventDefault();toast('Đã lưu khung giờ trong phiên demo.')}
function renderAdmin(){setHeader();let pending=partners.filter(p=>p.status==='pending'),allReviews=reviews.filter(r=>!r.approved);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Khu vực quản trị</div><h1>Admin Dashboard</h1><p>Quản lý tài khoản, duyệt cơ sở đối tác và kiểm duyệt đánh giá.</p></div><span class="tag">Demo quản trị</span></div><div class="statgrid"><div class="stat"><span class="muted tiny">Tài khoản người dùng</span><strong>${users.length}</strong></div><div class="stat"><span class="muted tiny">Hồ sơ chờ duyệt</span><strong>${pending.length}</strong></div><div class="stat"><span class="muted tiny">Đánh giá chờ duyệt</span><strong>${allReviews.length}</strong></div></div><div class="panel" style="margin-top:18px"><div class="tabs"><button class="${activeAdminTab==='approvals'?'active':''}" onclick="adminTab('approvals')">Duyệt đối tác</button><button class="${activeAdminTab==='users'?'active':''}" onclick="adminTab('users')">Người dùng</button><button class="${activeAdminTab==='reviews'?'active':''}" onclick="adminTab('reviews')">Kiểm duyệt đánh giá</button><button class="${activeAdminTab==='services'?'active':''}" onclick="adminTab('services')">Danh mục & dịch vụ</button><button class="${activeAdminTab==='complaints'?'active':''}" onclick="adminTab('complaints')">Khiếu nại</button></div>${adminPanel()}</div>`}
function adminTab(t){activeAdminTab=t;renderAdmin()}
function adminPanel(){if(activeAdminTab==='approvals'){let list=partners.filter(p=>p.status==='pending'||p.status==='rejected');return `<h2>Hồ sơ đối tác cần xử lý</h2><div class="tablewrap"><table><tr><th>Cơ sở</th><th>Danh mục</th><th>Đại diện</th><th>Địa chỉ</th><th>Giấy phép</th><th>Trạng thái</th><th>Thao tác</th></tr>${list.map(p=>`<tr><td>${esc(p.business)}<div class="muted tiny">${esc(p.phone)}</div></td><td>${esc(p.category)}</td><td>${esc(p.representative)}</td><td>${esc(p.address)}</td><td>${esc(p.license||'Chưa cung cấp')}</td><td><span class="status ${p.status==='pending'?'wait':'no'}">${p.status==='pending'?'Chờ duyệt':'Từ chối'}</span></td><td><button class="small" onclick="approvePartner(${p.id},'approved')">Phê duyệt</button> <button class="small danger" onclick="approvePartner(${p.id},'rejected')">Từ chối</button></td></tr>`).join('')||'<tr><td colspan="7">Không có hồ sơ cần xử lý.</td></tr>'}</table></div>`}
if(activeAdminTab==='users')return `<h2>Danh sách người dùng</h2><div class="tablewrap"><table><tr><th>Họ tên</th><th>Email</th><th>Số điện thoại</th><th>Vai trò</th><th>Trạng thái</th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='partner'?'Đối tác':u.role==='customer'?'Khách hàng':'Chưa chọn'}</td><td><span class="status">Hoạt động</span></td></tr>`).join('')||'<tr><td colspan="5">Chưa có người dùng.</td></tr>'}</table></div>`;
if(activeAdminTab==='reviews')return `<h2>Đánh giá chờ kiểm duyệt</h2>${reviews.filter(r=>!r.approved).map(r=>`<div class="panel"><b>${esc(r.name)}</b> · ${'★'.repeat(r.stars)}<p>${esc(r.text)}</p><button onclick="moderateReview(${r.id},true)">Phê duyệt</button> <button class="danger" onclick="moderateReview(${r.id},false)">Bác bỏ</button></div>`).join('')||'<p class="muted">Không có đánh giá chờ duyệt.</p>'}`;
if(activeAdminTab==='services')return `<h2>Danh mục dịch vụ</h2><p class="muted">Các danh mục chuẩn để đối tác lựa chọn.</p><div class="grid">${['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện','Đưa đón'].map((c,i)=>`<div class="card"><div class="cardbody"><h3>${['🛁','🩺','🏡','🎾','🚗'][i]} ${c}</h3><p class="muted tiny">${services.filter(s=>s.category===c).length} dịch vụ đang có</p></div></div>`).join('')}</div><div class="notice">Trong bản demo, danh mục mẫu đã được tạo sẵn. Thêm/sửa danh mục mới cần kết nối cơ sở dữ liệu ở phiên bản đầy đủ.</div>`;
return `<h2>Trung tâm khiếu nại</h2><p>Giao diện tiếp nhận khiếu nại về chất lượng dịch vụ, thanh toán hoặc thái độ phục vụ sẽ được kết nối với hệ thống phiếu hỗ trợ trong bản triển khai backend.</p><div class="field"><label>Mô tả khiếu nại demo</label><textarea id="complaintText" placeholder="Nhập nội dung để minh họa quy trình..."></textarea></div><button style="margin-top:10px" onclick="toast('Đã ghi nhận minh họa. Phiếu khiếu nại chưa được lưu lên máy chủ.')">Tạo phiếu demo</button>`}
function approvePartner(id,status){let p=partners.find(x=>x.id===id);if(p){p.status=status;if(status==='approved'){let has=services.some(s=>s.partner===p.business);if(!has)services.push({id:Date.now(),partner:p.business,category:p.category,name:p.category==='Spa & Grooming'?'Dịch vụ chăm sóc cơ bản':p.category+' cơ bản',price:150000,duration:60,emoji:'🐾',description:p.description,address:p.address,rating:5,approved:true})}persist();renderAdmin();toast(status==='approved'?'Đã phê duyệt đối tác.':'Đã từ chối hồ sơ.')}} 
function moderateReview(id,ok){let r=reviews.find(x=>x.id===id);if(r){if(ok)r.approved=true;else reviews=reviews.filter(x=>x.id!==id);persist();renderAdmin();toast(ok?'Đã duyệt đánh giá.':'Đã bác bỏ đánh giá.')}}
function init(){setHeader();showPage('home')}
init();
</script>
</body>
</html>
