/* PetSen professional vertical application shell */
:root{--green:#087f68;--green2:#066653;--mint:#e8f6f1;--bg:#f5f8f7;--ink:#1e3531;--muted:#72827d;--line:#e2eae7}
body{background:#f5f8f7}
.topbar{position:fixed;inset:0 auto 0 0;width:248px;height:100vh;z-index:30;background:#fff;border:0;border-right:1px solid #e1eae6;box-shadow:5px 0 24px #173c2b06;overflow-y:auto}
.topbar .wrap.nav{width:100%;max-width:none;height:auto;min-height:100%;margin:0;padding:24px 16px 18px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0}
.brand{display:grid;grid-template-columns:40px 1fr;align-items:center;column-gap:8px;font-size:25px;letter-spacing:-.7px;padding:0 8px 4px}
.brand-paw{grid-row:span 2;display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#e5f5ef;font-size:22px}
.brand-name{line-height:1.05}.brand-name>span{color:#243b36}.brand small{grid-column:2;font-size:8px;letter-spacing:1.15px;color:#92a19a;font-weight:800;margin-top:4px}
.nav-caption{margin:34px 10px 10px;color:#9aa8a2;font-size:10px;font-weight:800;letter-spacing:1.25px}
.navlinks{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:100%;flex-wrap:nowrap}
.navlinks button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:45px;padding:10px 12px;border-radius:12px;background:transparent;color:#66756f;font-size:13px;font-weight:650;transition:background .18s,color .18s,transform .18s}

.nav-icon{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:8px;background:#f3f6f5;color:#70827b;font-size:17px;font-weight:800}
.navlinks button:hover .nav-icon{background:#dff3eb;color:var(--green)}
.sidebar-bottom{margin-top:auto;padding-top:28px}
.sidebar-help{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#eef9f4,#f5f4ff);border:1px solid #e5eee9;padding:12px;border-radius:14px;margin-bottom:13px}

.footer{margin-left:248px;background:#f5f8f7}
.hero{border-radius:22px;background:linear-gradient(120deg,#e5f5ef 0%,#f5f5ff 58%,#fff6ed 100%);border-color:#e2eee8}

.home-topline{display:flex;align-items:center;justify-content:space-between;gap:22px;margin:0 0 22px}
.home-topline h1{font-size:27px;letter-spacing:-.7px;margin:4px 0 2px;color:#214b41}

.home-search{display:flex;align-items:center;gap:8px;max-width:570px;min-width:320px;background:#fff;border:1px solid #e0ebe5;border-radius:15px;padding:7px 8px;box-shadow:0 5px 18px #173c2b06}

.home-search select{max-width:150px;border:0;border-left:1px solid #e4ece7;padding:8px 6px;color:#64776d;background:transparent;font-size:12px}
.home-search button{white-space:nowrap;padding:10px 14px;font-size:12px}
.home-dashboard{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.home-main{min-width:0}
.home-hero{padding:0;min-height:300px;grid-template-columns:1.1fr .9fr;gap:0;position:relative;border-radius:22px;background:linear-gradient(110deg,#e5f5ec 0%,#f5f6ef 56%,#fff3e9 100%);border:1px solid #e1eee5}

.hero-sticker{position:absolute;right:14px;top:18px;z-index:2;transform:rotate(7deg);background:#fff9e9;color:#c18a45;border:1px solid #f5dfb4;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:800;text-align:center;box-shadow:0 5px 14px #72542b12}

.home-rail{display:flex;flex-direction:column;gap:13px;min-width:0}
.rail-panel{background:#fff;border:1px solid #e2ebe6;border-radius:17px;padding:15px;box-shadow:0 5px 20px #21452d08}

.rail-pet{display:flex;gap:11px;align-items:center}

.rail-pet-avatar img{width:100%;height:100%;object-fit:cover}
.rail-pet b{font-size:13px;color:#264e44}
.rail-pet p{font-size:10px;color:#8b9992;margin:3px 0 6px}
.rail-health{font-size:10px;color:#2c8b6f}
.rail-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.rail-tags span{font-size:9px;padding:5px 7px;border-radius:99px;background:#edf8f3;color:#508675}
.rail-empty{text-align:center;padding:8px 4px 4px}
.rail-empty>div{font-size:31px;margin-bottom:3px}
.rail-empty b{font-size:12px}
.rail-empty p{font-size:11px;line-height:1.5;color:#87968f;margin:6px auto 11px;max-width:230px}
.rail-empty button{font-size:11px;padding:8px 12px}
.rail-empty.compact{padding:0}
.rail-transaction{display:flex;gap:10px;padding:10px 0;border-top:1px solid #edf1ee}
.rail-transaction:first-of-type{border-top:0;padding-top:0}
.transaction-thumb{width:49px;height:49px;flex:0 0 49px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#edf8f0,#fff2e8);font-size:23px}
.transaction-copy{flex:1;min-width:0}
.transaction-copy>b{font-size:11px;display:block;color:#355d52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transaction-copy small{display:block;font-size:9px;color:#8c9a93;margin:4px 0 7px}
.transaction-copy .row{gap:5px}
.transaction-copy .status{font-size:9px;padding:3px 6px}
.transaction-copy .row>b{font-size:10px;color:#287a62}
.rail-suggestion{width:100%;display:flex;align-items:center;gap:9px;padding:9px 0;background:transparent;color:#2b4e44;border-bottom:1px solid #eef2ef;text-align:left;border-radius:0}
.rail-suggestion:last-child{border-bottom:0;padding-bottom:0}

.rail-suggestion b{font-size:10px}
.rail-suggestion small{font-size:9px;line-height:1.35;color:#8a9991;margin:3px 0 5px}
.rail-suggestion em{font-size:10px;font-style:normal;color:#27886d;font-weight:800}
.suggestion-arrow{color:#3a907a;font-size:17px}
.category-section,.featured-section{margin-top:27px}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.category-tile{position:relative;min-width:0;min-height:143px;text-align:left;color:#2d5148;background:var(--tile-bg);border:1px solid #e7eee9;border-radius:15px;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:transform .2s,box-shadow .2s}

.category-tile b{font-size:12px}
.category-tile small{font-size:10px;color:#7e9187;line-height:1.35}
.category-arrow{position:absolute;right:10px;bottom:10px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#ffffffb8;color:#368a73}
.featured-section .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.featured-section .partner-cover{height:130px}
.featured-section .serviceimg{height:130px}

.featured-section .card h3{font-size:14px}
.home-main .sectionhead{margin:25px 0 12px}
.home-main .sectionhead h2{font-size:17px;color:#28584e}
.home-main .sectionhead p{font-size:11px}
.home-main .personal-recommendations{margin-top:22px}
.auth-screen .topbar{display:none}
.auth-screen #app.wrap.page{margin-left:0;max-width:1400px;padding:24px clamp(18px,3vw,52px) 45px;min-height:100vh}
.auth-screen .footer{display:none}

.auth-screen .authside{min-height:700px;padding:44px;background:linear-gradient(155deg,#eef7e9 0%,#fff2e8 54%,#f7eaf2 100%)}

function setHeader(){let n=$('#userchip');n.innerHTML=currentUser?`<span class="userchip">${currentRole==='partner'?'🏪':'🐾'} ${esc(currentUser.name)} · ${currentRole==='partner'?'Đối tác':currentRole==='admin'?'Admin':'Khách hàng'}</span> <button class="small secondary" onclick="logout()">Đăng xuất</button>`:''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(page){document.body.classList.toggle('workspace-compact',page==='partner'||page==='admin');document.body.classList.toggle('auth-screen',page==='login'||page==='register'||page==='role');setHeader();const app=$('#app');if(page==='home')return renderHome();if(page==='services')return renderServices();if(page==='partners')return renderPartners();if(page==='blog')return renderBlog();if(page==='register')return renderRegister();if(page==='login')return renderLogin();if(page==='role')return renderRole();if(page==='partnerApply')return renderPartnerApply();if(page==='pending')return renderPending();if(page==='customer')return renderCustomer();if(page==='pets')return renderPets();if(page==='petForm')return renderPetForm();if(page==='serviceDetail')return renderServiceDetail();if(page==='recommendations')return renderRecommendations();if(page==='providers')return renderProviders();if(page==='intakeResults')return renderIntakeResults();if(page==='booking')return renderBooking();if(page==='myBookings')return renderMyBookings();if(page==='partner')return renderPartnerDashboard();if(page==='admin')return renderAdmin();if(page==='checkout')return renderCheckout();if(page==='review')return renderReview();app.innerHTML='<div class="empty">Không tìm thấy trang.</div>'}
function goHome(){if(currentRole==='partner')showPage('partner');else if(currentRole==='admin')showPage('admin');else showPage('home')}
function logout(){currentUser=null;currentRole=null;setHeader();showPage('home');toast('Bạn đã đăng xuất.')}

function personalRecommendationMarkup(){
 if(!currentUser||currentRole!=='customer')return '';
 const owned=pets.filter(p=>p.userId===currentUser.id);
 if(!owned.length)return `<div class="panel" style="margin-top:22px;background:linear-gradient(120deg,#f0f9f2,#fff5ec)"><div class="row between"><div><div class="eyebrow">Gợi ý dành riêng cho bé</div><h2 style="margin:5px 0">Tạo hồ sơ để nhận đề xuất phù hợp 🐾</h2><p class="muted">PetSen sẽ kết hợp thông tin sức khỏe và lịch sử giao dịch để điều chỉnh gợi ý dịch vụ.</p></div><button onclick="showPage('petForm')">＋ Tạo hồ sơ</button></div></div>`;
 const pet=owned.slice().sort((a,b)=>(Number(b.updatedAt||b.id)||0)-(Number(a.updatedAt||a.id)||0))[0];
 const cats=recommendedCategories(pet).slice(0,3);
 const history=bookings.filter(b=>b.customerId===currentUser.id&&Number(b.petId)===Number(pet.id));
 const hasHealth=!!(pet.health&& !/chưa cập nhật|khỏe mạnh|không có/i.test(pet.health));
 const labels={'Spa & Grooming':'Chăm sóc lông và vệ sinh','Khám chữa bệnh':'Theo dõi sức khỏe','Trông giữ':'Trông giữ an toàn','Huấn luyện':'Huấn luyện tích cực'};
 const desc={'Spa & Grooming':'Gợi ý dựa trên thông tin và nhu cầu chăm sóc của bé.','Khám chữa bệnh':hasHealth?'Hồ sơ có lưu ý sức khỏe — cân nhắc cơ sở thú y phù hợp.':'Theo dõi sức khỏe định kỳ cho bé.','Trông giữ':'Tìm không gian chăm sóc phù hợp khi bạn bận.','Huấn luyện':'Các buổi huấn luyện nhẹ nhàng, phù hợp hành vi của bé.'};
 const icons={'Spa & Grooming':'🫧','Khám chữa bệnh':'🩺','Trông giữ':'🏡','Huấn luyện':'🎾'};
 return `<div class="sectionhead"><div><div class="eyebrow">Cập nhật theo hồ sơ & lịch sử</div><h2>Gợi ý mới cho ${esc(pet.name)} ✨</h2><p>Đề xuất được sắp xếp lại theo hồ sơ hiện tại và các giao dịch đã lưu của bé.</p></div><button class="secondary" onclick="showPage('recommendations')">Xem đề xuất →</button></div><div class="grid">${cats.map((c,i)=>`<article class="card"><div class="serviceimg" style="font-size:56px;background:linear-gradient(135deg,#e5f6e9,#fff0e8,#f0eaff)">${icons[c]}</div><div class="cardbody"><span class="tag">${i===0?'Ưu tiên cá nhân hóa':history.length?'Dựa trên hồ sơ & lịch sử':'Theo hồ sơ thú cưng'}</span><h3 style="margin-top:10px">${labels[c]}</h3><p class="muted tiny">${desc[c]}</p><button onclick="selectDiscoveryCategory('${c}')">Xem dịch vụ phù hợp →</button></div></article>`).join('')}</div>`;
}

function renderHomePartnerCards(){
 const all=[...new Set(services.filter(s=>s.approved).map(s=>s.partner))].filter(name=>{const p=partners.find(x=>x.business===name&&x.status==='approved');return !p||p.visibility!=='hidden'}).map((name,i)=>{
  const profile=partners.find(p=>p.business===name&&p.status==='approved');
  const svc=services.find(s=>s.partner===name&&s.approved);
  return {name,profile,svc,count:services.filter(s=>s.partner===name&&s.approved).length,i};
 });

}

function serviceCard(s){return `<article class="card"><div class="serviceimg">${s.photo?`<img class="service-photo" src="${s.photo}" alt="Ảnh minh họa ${esc(s.partner)}" loading="lazy" onerror="this.parentElement.innerHTML='🐾'">`:s.emoji||'🐾'}</div><div class="cardbody"><div class="row between"><span class="tag">${esc(s.category)}</span><span class="stars">★ ${s.rating||'4.8'}</span></div><h3 style="margin-top:10px">${esc(s.name)}</h3><div class="muted tiny">🏪 ${esc(s.partner)} · 📍 ${esc(s.address||'Hà Nội')}</div><p class="muted tiny">${esc(s.description||'Dịch vụ chăm sóc thú cưng.')}</p><div class="row between"><span class="price">${money(s.price)}</span><button onclick="chooseDiscoveryService(${s.id})">Tìm cơ sở</button></div></div></article>`}
function renderServices(q='',cat=''){setHeader();discoveryQuery=q;discoveryCategory=cat;let list=services.filter(s=>s.approved&&(!cat||s.category===cat)&&(!q||(s.name+' '+s.partner+' '+s.category+' '+s.address).toLowerCase().includes(q.toLowerCase())));$('#app').innerHTML=`<div class="sectionhead"><div><h1>Dịch vụ thú cưng</h1><p>Tìm kiếm theo tên dịch vụ, danh mục hoặc cơ sở.</p></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Từ khóa</label><input id="serviceQ" value="${esc(q)}" placeholder="Ví dụ: tắm, khám, Cầu Giấy"></div><div class="field"><label>Danh mục</label><select id="serviceCat"><option value="">Tất cả danh mục</option>${['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện'].map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="actions"><button onclick="renderServices($('#serviceQ').value,$('#serviceCat').value)">Tìm kiếm</button><button class="secondary" onclick="renderServices()">Xóa bộ lọc</button></div></div><div class="grid">${list.map(serviceCard).join('')||'<div class="empty">Chưa tìm thấy dịch vụ phù hợp.</div>'}</div>`}

c thú cưng.')}</p><div class="actions"><button onclick="renderServices('${esc(x.name)}')">Xem dịch vụ</button><button class="secondary" onclick="toast('Đây là hồ sơ đối tác mô phỏng trong bản demo.')">Thông tin cơ sở</button></div></div></article>`).join('')}</div><div class="notice">Lưu ý: tên cơ sở, ảnh, đánh giá và dịch vụ là dữ liệu mô phỏng để trình bày giao diện; chưa phải danh sách đối tác xác minh thực tế.</div>`}

d" style="margin-top:12px"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="name@email.com"></div><div class="field"><label>Số điện thoại</label><input name="phone" required pattern="[0-9+ ]{9,16}" placeholder="09xxxxxxxx"></div><div class="field full"><label>Mật khẩu</label><input name="password" type="password" minlength="6" required placeholder="Tối thiểu 6 ký tự"></div></div><div class="notice">Sau khi đăng ký, bạn sẽ chọn một trong hai vai trò: Khách hàng hoặc Đối tác.</div><button type="submit" style="width:100%;padding:13px">Tạo tài khoản &nbsp; →</button></form><p class="muted tiny" style="text-align:center;margin-top:15px">Bằng việc tiếp tục, bạn đồng ý với điều khoản sử dụng và chính sách bảo mật của PetSen.</p></div></div>`}
function socialAuth(provider){toast('Đăng nhập '+provider+' đang ở chế độ giao diện demo. Muốn xác thực thật cần cấu hình OAuth và máy chủ.');}
function registerUser(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase();if(users.some(u=>u.email===email)){toast('Email đã được đăng ký. Hãy đăng nhập.');return}let u={id:Date.now(),name:f.get('name'),email,phone:f.get('phone'),password:f.get('password'),role:null};users.push(u);persist();currentUser=u;showPage('role')}
function renderRole(){setHeader();$('#app').innerHTML=`<div style="max-width:800px;margin:auto;text-align:center"><div class="eyebrow">Bước tiếp theo</div><h1>Chọn vai trò của bạn</h1><p class="muted">PetSen sẽ thiết lập giao diện và công cụ phù hợp với mục đích sử dụng.</p><div class="grid two" style="margin-top:28px"><div class="card"><div class="serviceimg">🐾</div><div class="cardbody"><h2>Khách hàng</h2><p class="muted">Tìm dịch vụ, quản lý hồ sơ thú cưng, đặt lịch và đánh giá cơ sở.</p><button style="width:100%" onclick="chooseRole('customer')">Tiếp tục với vai trò khách hàng</button></div></div><div class="card"><div class="serviceimg">🏪</div><div class="cardbody"><h2>Đối tác dịch vụ</h2><p class="muted">Đăng ký cơ sở, gửi minh chứng để kiểm duyệt và quản lý dịch vụ.</p><button style="width:100%" onclick="chooseRole('partner')">Đăng ký làm đối tác</button></div></div></div></div>`}
function chooseRole(role){if(!currentUser){showPage('register');return}currentUser.role=role;users=users.map(u=>u.id===currentUser.id?currentUser:u);persist();if(role==='partner')showPage('partnerApply');else{currentRole='customer';showPage('home');toast('Tài khoản khách hàng đã sẵn sàng.')}} 
function renderPartnerApply(){setHeader();$('#app').innerHTML=`<div class="sectionhead"><div><h1>Đăng ký cơ sở đối tác</h1><p>Hoàn thiện hồ sơ cơ sở và gửi quản trị viên kiểm duyệt. Danh mục dịch vụ và hình thức tiếp nhận sẽ được thiết lập sau khi đăng ký gian hàng.</p></div><span class="tag">Hồ sơ đối tác</span></div><div class="steps"><span class="step active">1. Thông tin đại diện</span><span class="step active">2. Thông tin cơ sở</span><span class="step active">3. Minh chứng</span><span class="step">4. Kiểm duyệt</span></div><form class="panel" onsubmit="submitPartner(event)"><div class="formgrid"><div class="field"><label>Tên cơ sở</label><input name="business" required placeholder="Ví dụ: PetCare Spa"></div><div class="field"><label>Người đại diện</label><input name="representative" required value="${esc(currentUser?.name||'')}"></div><div class="field"><label>Số điện thoại liên hệ</label><input name="phone" required value="${esc(currentUser?.phone||'')}"></div><div class="field full"><label>Địa chỉ cơ sở</label><input name="address" required placeholder="Số nhà, đường, quận/huyện, tỉnh/thành"></div><div class="field full"><label>Mô tả cơ sở và dịch vụ</label><textarea name="description" required placeholder="Giới thiệu năng lực, quy trình chăm sóc, thời gian hoạt động..."></textarea></div><div class="field"><label>Mã số doanh nghiệp / giấy phép (nếu có)</label><input name="license" placeholder="Nhập mã hoặc thông tin giấy phép"></div><div class="field"><label>Ảnh/logo cơ sở</label><input name="photo" type="file" accept="image/*" onchange="previewFile(this,'partnerPreview')"><div id="partnerPreview"></div></div><div class="field full"><label>Tải minh chứng (giấy phép, chứng chỉ, ảnh cơ sở)</label><input name="proof" type="file" accept="image/*,.pdf" multiple><span class="hint">Bản demo chỉ lưu thông tin hồ sơ; tệp chưa được tải lên máy chủ.</span></div></div><div class="notice">Sau khi gửi, trạng thái sẽ là “Chờ duyệt”. Trong bản demo, tài khoản đối tác chỉ vào trang quản lý sau khi Admin phê duyệt.</div><div class="actions"><button type="submit">Gửi hồ sơ kiểm duyệt</button><button type="button" class="secondary" onclick="showPage('role')">Quay lại chọn vai trò</button></div></form>`}
function submitPartner(e){e.preventDefault();let f=new FormData(e.target);let p={id:Date.now(),userId:currentUser.id,business:f.get('business'),category:'',representative:f.get('representative'),phone:f.get('phone'),address:f.get('address'),description:f.get('description'),license:f.get('license'),acceptMethods:['Đến trực tiếp cơ sở'],status:'pending',created:new Date().toISOString()};partners.push(p);currentUser.role='partner';users=users.map(u=>u.id===currentUser.id?currentUser:u);persist();showPage('pending')}
function renderPending(){setHeader();let p=partners.find(x=>x.userId===currentUser?.id);$('#app').innerHTML=`<div class="panel" style="max-width:760px;margin:30px auto;text-align:center;padding:36px"><div style="font-size:64px">📨</div><span class="tag">Hồ sơ đối tác</span><h1>Hồ sơ đã được gửi</h1><p class="muted">Cơ sở <b>${esc(p?.business||'')}</b> đang ở trạng thái <b>${p?.status==='approved'?'Đã phê duyệt':p?.status==='rejected'?'Yêu cầu bổ sung / từ chối':'Chờ Admin kiểm duyệt'}</b>.</p><p>Trong thời gian chờ, bạn có thể đăng xuất. Khi hồ sơ được phê duyệt, hãy đăng nhập lại để sử dụng trang quản lý đối tác.</p><div class="actions" style="justify-content:center"><button onclick="showPage('login')">Đến đăng nhập</button><button class="secondary" onclick="showPage('admin')">Mở trang kiểm duyệt demo</button></div><p class="muted tiny">Trang kiểm duyệt demo không có bảo mật quản trị trong phiên bản HTML này.</p></div>`}

ons"><label><input type="checkbox" name="remember" style="width:auto"> Ghi nhớ đăng nhập</label><a href="#" onclick="event.preventDefault();toast('Tính năng khôi phục mật khẩu cần được kết nối máy chủ.')">Quên mật khẩu?</a></div><button type="submit" style="width:100%;padding:13px">Đăng nhập</button></form><div class="divider"></div><p class="muted tiny">Demo Admin: <b>admin@petsen.vn</b> / <b>PetSen123</b></p><p class="muted tiny">Demo Đối tác: <b>partner@petsen.vn</b> / <b>PetSen123</b></p></div></div>`}
function loginUser(e){e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),pass=f.get('password');if(email==='admin@petsen.vn'&&pass==='PetSen123'){currentUser={id:0,name:'Quản trị viên',email};currentRole='admin';showPage('admin');return}let u=users.find(x=>x.email===email&&x.password===pass);if(!u){toast('Thông tin đăng nhập chưa đúng.');return}currentUser=u;if(u.role==='partner'){let p=partners.find(x=>x.userId===u.id);if(p?.status==='approved'){currentRole='partner';showPage('partner')}else{currentRole=null;showPage('pending')}}else if(!u.role){showPage('role')}else{currentRole='customer';showPage('home')}}
function renderCustomer(){showPage('home')}
function renderPets(){setHeader();if(!currentUser){$('#app').innerHTML=`<div class="empty"><h2>Đăng nhập để quản lý hồ sơ thú cưng</h2><button onclick="showPage('login')">Đăng nhập</button></div>`;return}let list=pets.filter(p=>p.userId===currentUser.id);$('#app').innerHTML=`<div class="sectionhead"><div><h1>Hồ sơ thú cưng thông minh</h1><p>Lưu thông tin cơ bản, ảnh, tình trạng sức khỏe và lịch sử chăm sóc.</p></div><button onclick="showPage('petForm')">＋ Thêm thú cưng</button></div>${list.length?`<div class="grid">${list.map(p=>`<div class="card"><div class="cardbody"><div class="petrow"><div class="petphoto">${p.image?`<img src="${p.image}" alt="Ảnh ${esc(p.name)}">`:'🐾'}</div><div><h3>${esc(p.name)}</h3><div class="muted tiny">${esc(p.species)} · ${esc(p.breed||'Chưa rõ giống')}</div><div class="muted tiny">${esc(p.age||'Chưa rõ tuổi')} · ${esc(p.weight||'Chưa rõ cân nặng')}</div></div></div><div class="divider"></div><b>Tình trạng sức khỏe</b><p class="muted tiny">${esc(p.health||'Chưa cập nhật')}</p><b>Lịch sử chăm sóc</b><p class="muted tiny">${(p.records||[]).map(r=>esc(r.type)+' — '+esc(r.date||r.relative||'Chưa ghi ngày')).join('<br>')||'Chưa có ghi chú'}</p><b>Lịch sử giao dịch</b><div class="tiny muted">${bookings.filter(b=>b.customerId===currentUser.id&&Number(b.petId)===Number(p.id)).sort((a,b)=>String(b.created||b.date||'').localeCompare(String(a.created||a.date||''))).slice(0,4).map(b=>`<div style="padding:7px 0;border-bottom:1px solid #edf1ed"><b>${esc(b.serviceName||'Dịch vụ thú cưng')}</b> · ${money(b.price)}<br>${esc(b.date||'Chưa có ngày')} ${esc(b.time||'')} · <span class="status">${esc(b.status||'Đã đặt lịch')}</span></div>`).join('')||'Chưa có giao dịch. Các dịch vụ đã đặt sẽ xuất hiện tại đây và được dùng để điều chỉnh đề xuất.'}</div><div class="actions"><button class="secondary" onclick="editPet(${p.id})">Chỉnh sửa</button><button class="danger small" onclick="deletePet(${p.id})">Xóa</button></div></div></div>`).join('')}</div>`:'<div class="empty"><div style="font-size:48px">🐶</div><h3>Chưa có hồ sơ thú cưng</h3><p>Thêm hồ sơ để đặt lịch nhanh hơn và lưu thông tin sức khỏe.</p><button onclick="showPage(\'petForm\')">Tạo hồ sơ đầu tiên</button></div>'}`}
let editingPet=null;
function renderPetForm(){setHeader();if(!currentUser){showPage('login');return}let p=editingPet||{};$('#app').innerHTML=`<div class="sectionhead"><div><h1>${p.id?'Cập nhật':'Tạo'} hồ sơ thú cưng</h1><p>Các thông tin có gợi ý để bạn điền nhanh. Chỉ chia sẻ thông tin sức khỏe cần thiết cho việc chăm sóc.</p></div></div><div class="steps"><span class="step active">1. Thông tin cơ bản</span><span class="step active">2. Sức khỏe</span><span class="step active">3. Lịch sử chăm sóc</span></div><form class="panel" onsubmit="savePet(event)"><div class="formgrid"><div class="field"><label>Tên thú cưng *</label><input name="name" required value="${esc(p.name||'')}" placeholder="Ví dụ: Miu, Bông, Đậu"></div><div class="field"><label>Loài *</label><select name="species" required><option value="">Chọn loài</option>${['Chó','Mèo','Thỏ','Hamster','Chim','Khác'].map(x=>`<option ${p.species===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Giống</label><input name="breed" value="${esc(p.breed||'')}" placeholder="Ví dụ: Poodle, mèo Anh lông ngắn"></div><div class="field"><label>Ngày sinh hoặc tuổi</label><input name="age" value="${esc(p.age||'')}" placeholder="Ví dụ: 2 tuổi hoặc 12/05/2023"><span class="hint">Có thể nhập tuổi ước tính nếu không biết ngày sinh.</span></div><div class="field"><label>Cân nặng (kg)</label><input name="weight" type="number" min="0" step=".1" value="${esc(p.weight||'')}" placeholder="Ví dụ: 4.5"></div><div class="field"><label>Giới tính</label><select name="sex"><option value="">Chưa xác định</option><option ${p.sex==='Đực'?'selected':''}>Đực</option><option ${p.sex==='Cái'?'selected':''}>Cái</option></select></div><div class="field"><label>Ảnh thú cưng</label><input name="image" type="file" accept="image/*" onchange="previewFile(this,'petPreview')"><div id="petPreview">${p.image?`<img class="previewimg" style="width:100px;height:100px;border-radius:12px" src="${p.image}">`:''}</div><span class="hint">Ảnh demo được lưu trong trình duyệt; nên dùng ảnh nhỏ.</span></div><div class="field"><label>Tính cách / lưu ý khi tiếp xúc</label><input name="temperament" value="${esc(p.temperament||'')}" placeholder="Ví dụ: nhút nhát, sợ tiếng ồn, thân thiện"></div><div class="field full"><label>Bệnh lý / tình trạng sức khỏe hiện tại</label><textarea name="health" placeholder="Ví dụ: dị ứng thức ăn, đang dùng thuốc, từng phẫu thuật...">${esc(p.health||'')}</textarea><span class="hint">Gợi ý: dị ứng, bệnh nền, thuốc đang dùng, hạn chế vận động, dấu hiệu cần lưu ý.</span></div><div class="field full"><label>Ghi chú chăm sóc / lịch sử sức khỏe</label><div id="records">${(p.records||[]).map(recordRow).join('')}</div><button type="button" class="secondary" onclick="addRecord()">＋ Thêm lần chăm sóc / tiêm phòng</button><span class="hint">Có thể chọn ngày cụ thể hoặc ghi tương đối, ví dụ “khoảng 2 tháng trước”.</span></div></div><div class="actions"><button type="submit">Lưu hồ sơ</button><button type="button" class="secondary" onclick="editingPet=null;showPage('pets')">Hủy</button></div></form>`}
function recordRow(r={}){return `<div class="panel" style="padding:12px;margin:10px 0"><div class="formgrid"><div class="field"><label>Loại ghi chú</label><input class="rec-type" value="${esc(r.type||'')}" placeholder="Ví dụ: Đã tiêm phòng"></div><div class="field"><label>Ngày thực hiện cụ thể</label><input class="rec-date" type="date" value="${esc(r.date||'')}"></div><div class="field full"><label>Hoặc thời gian tương đối / chi tiết</label><input class="rec-relative" value="${esc(r.relative||'')}" placeholder="Ví dụ: khoảng 2 tháng trước; vaccine dại"></div></div><button type="button" class="danger small" onclick="this.parentElement.remove()">Xóa ghi chú</button></div>`}
function addRecord(){let d=document.createElement('div');d.innerHTML=recordRow({});$('#records').appendChild(d.firstElementChild)}
function savePet(e){e.preventDefault();let f=new FormData(e.target),records=[...document.querySelectorAll('#records .panel')].map(x=>({type:x.querySelector('.rec-type').value,date:x.querySelector('.rec-date').value,relative:x.querySelector('.rec-relative').value})).filter(r=>r.type||r.date||r.relative);let old=editingPet;let p={id:old?.id||Date.now(),userId:currentUser.id,name:f.get('name'),species:f.get('species'),breed:f.get('breed'),age:f.get('age'),weight:f.get('weight'),sex:f.get('sex'),temperament:f.get('temperament'),health:f.get('health'),records,image:old?.image||'',updatedAt:Date.now()};let file=f.get('image');if(file&&file.size){if(file.size>900000){toast('Ảnh hơi lớn. Hãy chọn ảnh dưới 900 KB trong bản demo.');return}let rd=new FileReader();rd.onload=()=>{p.image=rd.result;storePet(p,old)};rd.readAsDataURL(file)}else storePet(p,old)}
function storePet(p,old){if(old)pets=pets.map(x=>x.id===old.id?p:x);else pets.push(p);persist();editingPet=null;toast('Đã lưu hồ sơ thú cưng.');renderRecommendations(p)}
function editPet(id){editingPet=pets.find(p=>p.id===id);showPage('petForm')}
function deletePet(id){if(confirm('Bạn có chắc muốn xóa hồ sơ này?')){pets=pets.filter(p=>p.id!==id);persist();showPage('pets')}}
function previewFile(input,id){let file=input.files?.[0],el=$('#'+id);if(!file||!el)return;if(file.size>900000){toast('Vui lòng chọn ảnh nhỏ hơn 900 KB.');input.value='';return}let rd=new FileReader();rd.onload=()=>el.innerHTML=`<img class="previewimg" style="width:100px;height:100px;border-radius:12px" src="${rd.result}" alt="Ảnh xem trước">`;rd.readAsDataURL(file)}
function recommendedCategories(pet){
 const cats=['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện'];
 const health=(pet?.health||'').toLowerCase(),species=(pet?.species||'').toLowerCase(),age=(pet?.age||'').toLowerCase();
 let order=['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện'];
 if(health && !/chưa cập nhật|khỏe mạnh|không có/i.test(health)) order=['Khám chữa bệnh','Spa & Grooming','Trông giữ','Huấn luyện'];
 else if(species==='mèo') order=['Khám chữa bệnh','Spa & Grooming','Trông giữ','Huấn luyện'];
 else if(/tháng|bé|con/i.test(age)) order=['Khám chữa bệnh','Spa & Grooming','Huấn luyện','Trông giữ'];

function renderPartnerDashboard(){setHeader();let p=partners.find(x=>x.userId===currentUser?.id&&x.status==='approved');if(!p){showPage('pending');return}let mine=services.filter(s=>s.partner===p.business),orders=bookings.filter(b=>b.partner===p.business);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Cổng đối tác</div><h1>${esc(p.business)}</h1><p>${esc(p.address)} · <span class="status">Đã xác minh</span></p></div><button onclick="partnerTab('services')">＋ Thêm dịch vụ</button></div><div class="dash"><aside class="sidebar"><h3>QUẢN LÝ CƠ SỞ</h3><button class="${activePartnerTab==='overview'?'active':''}" onclick="partnerTab('overview')">⌂ Tổng quan</button><button class="${activePartnerTab==='orders'?'active':''}" onclick="partnerTab('orders')">▤ Quản lý đơn hàng</button><button class="${activePartnerTab==='revenue'?'active':''}" onclick="partnerTab('revenue')">＄ Doanh thu</button><button class="${activePartnerTab==='reviews'?'active':''}" onclick="partnerTab('reviews')">☆ Đánh giá</button><button class="${['settings','profile','services','hours'].includes(activePartnerTab)?'active':''}" onclick="partnerTab('settings')">⚙ Cài đặt</button><div style="height:1px;background:var(--line,#e6ebe7);margin:12px 4px"></div><button class="partner-logout" onclick="logout()">↪ Đăng xuất</button></aside><section>${partnerPanel(p,mine,orders)}</section></div>`}
function partnerTab(t){activePartnerTab=t;renderPartnerDashboard()}
function partnerPanel(p,mine,orders){if(activePartnerTab==='overview')return `<div class="statgrid"><div class="stat"><span class="muted tiny">Dịch vụ đang niêm yết</span><strong>${mine.length}</strong></div><div class="stat"><span class="muted tiny">Lịch hẹn</span><strong>${orders.length}</strong></div><div class="stat"><span class="muted tiny">Doanh thu tạm tính</span><strong>${money(orders.filter(b=>b.status==='Hoàn thành').reduce((a,b)=>a+b.price*.8,0))}</strong></div></div><div class="statusline"><div class="status-pill">Chờ xác nhận<b>${orders.filter(b=>b.status==='Đã đặt lịch').length}</b></div><div class="status-pill">Đã xác nhận<b>${orders.filter(b=>b.status==='Đã xác nhận').length}</b></div><div class="status-pill">Đang phục vụ<b>${orders.filter(b=>b.status==='Đang phục vụ').length}</b></div><div class="status-pill">Hoàn thành<b>${orders.filter(b=>b.status==='Hoàn thành').length}</b></div></div><div class="panel" style="margin-top:16px"><h2>Xin chào, ${esc(p.representative)}</h2><p class="muted">Quản lý dịch vụ, cập nhật lịch hoạt động và theo dõi các đơn đặt dịch vụ tại đây.</p><div class="notice">PetSen demo giả lập mức chiết khấu nền tảng 20%; chưa có thanh toán hoặc giải ngân thật.</div></div><div class="panel"><div class="row between"><div><h3>🏪 Gian hàng của bạn</h3><p class="muted tiny">Thông tin khách hàng nhìn thấy trên PetSen.</p></div><button class="small secondary" onclick="partnerTab('profile')">Chỉnh sửa gian hàng</button></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><img src="${p.photo||partnerPhotoForIndex(0)}" alt="Ảnh gian hàng của bạn" style="width:180px;height:120px;object-fit:cover;border-radius:14px" onerror="this.src=partnerPhotoForIndex(0)"><div style="flex:1;min-width:180px"><h3>${esc(p.business)}</h3><p class="muted">📍 ${esc(p.address)}</p><p>${esc(p.description||'Cơ sở chăm sóc thú cưng trên PetSen.')}</p><span class="tag">${mine.length} dịch vụ đang cung cấp</span><span class="tag">${(p.acceptMethods||['Đến trực tiếp cơ sở']).map(esc).join(' · ')}</span></div></div></div><div class="panel"><div class="row between"><div><h3>🐾 Khám phá các cơ sở khác</h3><p class="muted tiny">Tham khảo các đối tác khác đang hoạt động trên PetSen.</p></div><button class="small secondary" onclick="showPage('partners')">Xem tất cả →</button></div><div class="grid">${renderHomePartnerCards()}</div></div><div class="panel"><h3>Đơn đặt gần đây</h3>${orders.slice(-5).map(b=>`<p>• ${esc(b.serviceName)} — ${esc(b.date)} ${esc(b.time)} · <span class="status">${esc(b.status)}</span></p>`).join('')||'<p class="muted">Chưa có đơn đặt.</p>'}</div>`;
if(activePartnerTab==='profile')return `<div class="panel"><div class="settings-subnav"><button class="${activePartnerTab==='profile'?'active':''}" onclick="partnerTab('profile')">▣ Hồ sơ gian hàng</button><button onclick="partnerTab('services')">✚ Quản lý dịch vụ</button><button onclick="partnerTab('hours')">◷ Giờ hoạt động</button></div><h2>Hồ sơ gian hàng</h2><p class="muted">Cập nhật thông tin hiển thị công khai của cơ sở và ảnh đại diện gian hàng.</p><form onsubmit="savePartnerSettings(event)"><div class="partner-profile-layout"><div class="partner-image-preview">${p.photo?`<img id="partnerImagePreview" src="${p.photo}" alt="Ảnh gian hàng">`:`<img id="partnerImagePreview" src="${p.photo||'https://images.unsplash.com/photo-1601758228041-f3b2795255f1?auto=format&fit=crop&w=900&q=85'}" alt="Ảnh gian hàng">`}<span>Ảnh hiển thị tại danh sách cơ sở</span></div><div class="setting-grid"><div class="field"><label>Tên cơ sở</label><input name="business" value="${esc(p.business)}" required></div><div class="field"><label>Danh mục</label><input value="${esc(p.category||'Chăm sóc thú cưng')}" disabled></div><div class="field"><label>Người đại diện</label><input name="representative" value="${esc(p.representative||'')}" required></div><div class="field"><label>Email liên hệ</label><input name="email" type="email" value="${esc(p.email||currentUser.email||'')}" placeholder="contact@example.com"></div><div class="field"><label>Số điện thoại</label><input name="phone" value="${esc(p.phone||currentUser.phone||'')}" required></div><div class="field"><label>Địa chỉ cơ sở</label><input name="address" value="${esc(p.address||'')}" required></div><div class="field full"><label>Mô tả cơ sở</label><textarea name="description">${esc(p.description||'')}</textarea></div><div class="field full"><label>Ảnh cơ sở</label><input type="file" accept="image/*" onchange="previewPartnerImage(this)"><input type="hidden" name="photoData" id="partnerPhotoData" value=""><small class="muted">Chọn ảnh JPG, PNG hoặc WebP. Ảnh sẽ được thu nhỏ để phù hợp với bản demo.</small></div><div class="field full"><label>Hình thức tiếp nhận dịch vụ</label><div class="intake-setting-options"><label><input type="checkbox" name="acceptMethods" value="Đến trực tiếp cơ sở" ${(p.acceptMethods||['Đến trực tiếp cơ sở']).includes('Đến trực tiếp cơ sở')?'checked':''}> Trực tiếp đến cơ sở</label><label><input type="checkbox" name="acceptMethods" value="Đưa đón tận nơi" ${(p.acceptMethods||['Đến trực tiếp cơ sở']).includes('Đưa đón tận nơi')?'checked':''}> Đưa đón tận nơi</label></div><small class="muted">Chỉ chọn hình thức mà cơ sở thực sự cung cấp. Khách hàng sẽ chỉ thấy cơ sở phù hợp với lựa chọn này.</small></div><div class="field"><label>Hiển thị gian hàng</label><select name="visibility"><option value="public" ${(p.visibility||'public')==='public'?'selected':''}>Công khai</option><option value="hidden" ${p.visibility==='hidden'?'selected':''}>Ẩn khỏi danh sách</option></select></div></div></div><div class="actions"><button type="submit">Lưu hồ sơ gian hàng</button></div></form></div>`;
if(activePartnerTab==='services')return `<div class="panel"><div class="settings-subnav"><button onclick="partnerTab('profile')">▣ Hồ sơ gian hàng</button><button class="active" onclick="partnerTab('services')">✚ Quản lý dịch vụ</button><button onclick="partnerTab('hours')">◷ Giờ hoạt động</button></div><div class="row between"><h2>Quản lý dịch vụ</h2><button onclick="newService()">＋ Thêm dịch vụ</button></div><div class="tablewrap"><table><tr><th>Tên dịch vụ</th><th>Danh mục</th><th>Giá</th><th>Thời lượng</th><th>Trạng thái</th><th>Thao tác</th></tr>${mine.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.category)}</td><td>${money(s.price)}</td><td>${s.duration} phút</td><td><span class="status">Đang hoạt động</span></td><td><button class="small danger" onclick="removeService(${s.id})">Xóa</button></td></tr>`).join('')}</table></div><div id="serviceForm"></div></div>`;
if(activePartnerTab==='hours')return `<div class="panel"><div class="settings-subnav"><button onclick="partnerTab('profile')">▣ Hồ sơ gian hàng</button><button onclick="partnerTab('services')">✚ Quản lý dịch vụ</button><button class="active" onclick="partnerTab('hours')">◷ Giờ hoạt động</button></div><h2>Thiết lập khung giờ hoạt động</h2><form onsubmit="saveHours(event)"><div class="formgrid"><div class="field"><label>Ngày hoạt động</label><select name="days" multiple size="4"><option>Thứ 2</option><option>Thứ 3</option><option>Thứ 4</option><option>Thứ 5</option><option>Thứ 6</option><option>Thứ 7</option><option>Chủ nhật</option></select><span class="hint">Giữ Ctrl để chọn nhiều ngày.</span></div><div><div class="field"><label>Giờ mở cửa</label><input type="time" name="open" value="08:00"></div><div class="field" style="margin-top:10px"><label>Giờ đóng cửa</label><input type="time" name="close" value="20:00"></div><div class="field" style="margin-top:10px"><label>Số thú cưng tối đa mỗi khung giờ</label><input type="number" name="capacity" min="1" value="5"></div></div></div><button style="margin-top:14px">Lưu lịch hoạt động</button></form><div class="notice">Cấu hình này là bản demo trên trình duyệt; chưa chặn lịch trùng tự động.</div></div>`;
if(activePartnerTab==='orders')return `<div class="panel"><div class="row between"><div><h2>Quản lý đơn hàng</h2><p class="muted tiny">Theo dõi từng đơn và cập nhật trạng thái xử lý.</p></div><span class="tag">${orders.length} đơn</span></div><div class="statusline"><div class="status-pill">Mới đặt<b>${orders.filter(b=>b.status==='Đã đặt lịch').length}</b></div><div class="status-pill">Đã xác nhận<b>${orders.filter(b=>b.status==='Đã xác nhận').length}</b></div><div class="status-pill">Đang phục vụ<b>${orders.filter(b=>b.status==='Đang phục vụ').length}</b></div><div class="status-pill">Hoàn thành<b>${orders.filter(b=>b.status==='Hoàn thành').length}</b></div><div class="status-pill">Đã hủy<b>${orders.filter(b=>b.status==='Đã hủy').length}</b></div></div><div class="order-filter"><button class="secondary small" onclick="filterPartnerOrders('Tất cả')">Tất cả đơn</button><button class="secondary small" onclick="filterPartnerOrders('Đã đặt lịch')">Mới đặt</button><button class="secondary small" onclick="filterPartnerOrders('Đã xác nhận')">Đã xác nhận</button><button class="secondary small" onclick="filterPartnerOrders('Đang phục vụ')">Đang phục vụ</button><button class="secondary small" onclick="filterPartnerOrders('Hoàn thành')">Hoàn thành</button><button class="secondary small" onclick="filterPartnerOrders('Đã hủy')">Đã hủy</button></div><div class="tablewrap"><table><tr><th>Mã đơn</th><th>Khách hàng</th><th>Thú cưng</th><th>Dịch vụ</th><th>Thời gian</th><th>Trạng thái hiện tại</th><th>Cập nhật trạng thái</th></tr>${orders.map(b=>`<tr data-order-status="${esc(b.status)}"><td><b>#${b.id.toString().slice(-6)}</b></td><td>${esc(b.customerName)}</td><td>${esc(b.petName)}</td><td>${esc(b.serviceName)}</td><td>${esc(b.date)}<br>${esc(b.time)}</td><td><span class="status ${b.status==='Đã đặt lịch'?'wait':b.status==='Đã hủy'?'no':''}">${esc(b.status)}</span></td><td><select onchange="updateOrder(${b.id},this.value)"><option ${b.status==='Đã đặt lịch'?'selected':''}>Đã đặt lịch</option><option ${b.status==='Đã xác nhận'?'selected':''}>Đã xác nhận</option><option ${b.status==='Đang phục vụ'?'selected':''}>Đang phục vụ</option><option ${b.status==='Hoàn thành'?'selected':''}>Hoàn thành</option><option ${b.status==='Đã hủy'?'selected':''}>Đã hủy</option></select></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Chưa có đơn hàng. Khi khách đặt dịch vụ, đơn sẽ xuất hiện tại đây.</div></td></tr>'}</table></div><div class="notice">Trạng thái đơn được lưu trong trình duyệt hiện tại. Đây là bản demo, chưa đồng bộ đơn hàng giữa các thiết bị hoặc tài khoản.</div></div>`;
if(activePartnerTab==='revenue'){let gross=orders.filter(b=>b.status==='Hoàn thành').reduce((a,b)=>a+b.price,0);return `<div class="panel"><h2>Theo dõi doanh thu</h2><div class="statgrid"><div class="stat"><span class="muted tiny">Tổng giá trị dịch vụ</span><strong>${money(gross)}</strong></div><div class="stat"><span class="muted tiny">Chiết khấu PetSen (20%)</span><strong>${money(gross*.2)}</strong></div><div class="stat"><span class="muted tiny">Đối tác nhận (80%)</span><strong>${money(gross*.8)}</strong></div></div><div class="notice">Số liệu minh họa dựa trên đơn đã hoàn thành, không phải số dư thực tế và chưa có chức năng rút tiền.</div></div>`}
if(activePartnerTab==='settings')return `<div class="panel"><div class="eyebrow">Thiết lập gian hàng</div><h2>Cài đặt</h2><p class="muted">Chọn nội dung bạn muốn quản lý. Thông tin đã lưu sẽ được dùng để hiển thị cơ sở trên PetSen.</p><div class="settings-card-grid"><button class="settings-card" onclick="partnerTab('profile')"><span>▣</span><b>Hồ sơ gian hàng</b><small>Cập nhật tên, địa chỉ, mô tả và ảnh cơ sở</small><i>Quản lý →</i></button><button class="settings-card" onclick="partnerTab('services')"><span>✚</span><b>Quản lý dịch vụ</b><small>Thêm, xem và xóa dịch vụ đang cung cấp</small><i>Quản lý →</i></button><button class="settings-card" onclick="partnerTab('hours')"><span>◷</span><b>Giờ hoạt động</b><small>Thiết lập ngày, giờ mở cửa và công suất</small><i>Thiết lập →</i></button></div></div>`;
if(activePartnerTab==='reviews')return `<div class="panel"><h2>Đánh giá dịch vụ</h2>${reviews.filter(r=>mine.some(s=>s.id===r.serviceId)).map(r=>`<p><b>${esc(r.name)}</b> · ${'★'.repeat(r.stars)}<br>${esc(r.text)} · ${r.approved?'Đã duyệt':'Đang chờ duyệt'}</p>`).join('')||'<p class="muted">Chưa có đánh giá.</p>'}</div>`}
function newService(){let el=$('#serviceForm');if(!el)return;el.innerHTML=`<div class="divider"></div><h3>Thêm dịch vụ mới</h3><form onsubmit="saveService(event)"><div class="formgrid"><div class="field"><label>Tên dịch vụ</label><input name="name" required></div><div class="field"><label>Danh mục</label><select name="category"><option>Spa & Grooming</option><option>Khám chữa bệnh</option><option>Trông giữ</option><option>Huấn luyện</option></select></div><div class="field"><label>Giá niêm yết (VNĐ)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Thời lượng (phút)</label><input name="duration" type="number" min="1" value="60" required></div><div class="field full"><label>Mô tả</label><textarea name="description" required></textarea></div></div><div class="actions"><button>Lưu dịch vụ</button><button type="button" class="secondary" onclick="$('#serviceForm').innerHTML=''">Hủy</button></div></form>`}
function saveService(e){e.preventDefault();let p=partners.find(x=>x.userId===currentUser.id),f=new FormData(e.target);services.push({id:Date.now(),partner:p.business,category:f.get('category'),name:f.get('name'),price:Number(f.get('price')),duration:Number(f.get('duration')),emoji:'🐾',photo:'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=900&q=85',description:f.get('description'),address:p.address,rating:5,approved:true});persist();renderPartnerDashboard();toast('Đã thêm dịch vụ.')}
function removeService(id){if(confirm('Xóa dịch vụ này?')){services=services.filter(s=>s.id!==id);persist();renderPartnerDashboard()}}
function updateOrder(id,status){let b=bookings.find(x=>x.id===id);if(b){b.status=status;persist();toast('Đã cập nhật trạng thái đơn.');renderPartnerDashboard()}}
function saveHours(e){e.preventDefault();let f=new FormData(e.target),p=partners.find(x=>x.userId===currentUser?.id);if(p){p.open=f.get('open');p.close=f.get('close');p.capacity=f.get('capacity');p.days=f.getAll('days');persist()}toast('Đã lưu khung giờ hoạt động.');renderPartnerDashboard()}
function previewPartnerImage(input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Vui lòng chọn tệp hình ảnh.');return}const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.78);const hidden=document.getElementById('partnerPhotoData');if(hidden)hidden.value=data;const preview=document.getElementById('partnerImagePreview');if(preview)preview.src=data};img.src=ev.target.result};reader.readAsDataURL(file)}
function savePartnerSettings(e){e.preventDefault();let f=new FormData(e.target),p=partners.find(x=>x.userId===currentUser?.id);if(!p)return;let oldBusiness=p.business;p.business=f.get('business')||p.business;p.representative=f.get('representative')||p.representative;p.email=f.get('email')||p.email;p.phone=f.get('phone')||p.phone;p.address=f.get('address')||p.address;p.open=f.get('open')||p.open;p.close=f.get('close')||p.close;p.description=f.get('description')??p.description;p.accepting=f.get('accepting')||p.accepting;p.visibility=f.get('visibility')||p.visibility;const chosenMethods=f.getAll('acceptMethods');p.acceptMethods=chosenMethods.length?chosenMethods:['Đến trực tiếp cơ sở'];const uploaded=f.get('photoData');if(uploaded&&String(uploaded).startsWith('data:image/'))p.photo=String(uploaded);currentUser.name=p.representative;currentUser.email=p.email||currentUser.email;currentUser.phone=p.phone;users=users.map(u=>u.id===currentUser.id?currentUser:u);services.forEach(s=>{if(s.partner===oldBusiness||s.partner===p.business){s.partner=p.business;s.address=p.address;s.acceptMethods=[...p.acceptMethods];if(p.photo)s.photo=p.photo}});persist();renderPartnerDashboard();toast(p.photo?'Đã lưu hồ sơ và ảnh gian hàng.':'Đã lưu thông tin gian hàng.')}
function filterPartnerOrders(status){document.querySelectorAll('[data-order-status]').forEach(row=>{row.style.display=(status==='Tất cả'||row.dataset.orderStatus===status)?'':'none'})}
function renderAdmin(){setHeader();let pending=partners.filter(p=>p.status==='pending'),allReviews=reviews.filter(r=>!r.approved);$('#app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Khu vực quản trị</div><h1>Admin Dashboard</h1><p>Quản lý tài khoản, duyệt cơ sở đối tác và kiểm duyệt đánh giá.</p></div><span class="tag">Demo quản trị</span></div><div class="statgrid"><div class="stat"><span class="muted tiny">Tài khoản người dùng</span><strong>${users.length}</strong></div><div class="stat"><span class="muted tiny">Hồ sơ chờ duyệt</span><strong>${pending.length}</strong></div><div class="stat"><span class="muted tiny">Đánh giá chờ duyệt</span><strong>${allReviews.length}</strong></div></div><div class="panel" style="margin-top:18px"><div class="tabs"><button class="${activeAdminTab==='approvals'?'active':''}" onclick="adminTab('approvals')">Duyệt đối tác</button><button class="${activeAdminTab==='users'?'active':''}" onclick="adminTab('users')">Người dùng</button><button class="${activeAdminTab==='reviews'?'active':''}" onclick="adminTab('reviews')">Kiểm duyệt đánh giá</button><button class="${activeAdminTab==='services'?'active':''}" onclick="adminTab('services')">Danh mục & dịch vụ</button><button class="${activeAdminTab==='complaints'?'active':''}" onclick="adminTab('complaints')">Khiếu nại</button></div>${adminPanel()}</div>`}
function adminTab(t){activeAdminTab=t;renderAdmin()}
function adminPanel(){if(activeAdminTab==='approvals'){let list=partners.filter(p=>p.status==='pending'||p.status==='rejected');return `<h2>Hồ sơ đối tác cần xử lý</h2><div class="tablewrap"><table><tr><th>Cơ sở</th><th>Danh mục</th><th>Đại diện</th><th>Địa chỉ</th><th>Giấy phép</th><th>Trạng thái</th><th>Thao tác</th></tr>${list.map(p=>`<tr><td>${esc(p.business)}<div class="muted tiny">${esc(p.phone)}</div></td><td>${esc(p.category)}</td><td>${esc(p.representative)}</td><td>${esc(p.address)}</td><td>${esc(p.license||'Chưa cung cấp')}</td><td><span class="status ${p.status==='pending'?'wait':'no'}">${p.status==='pending'?'Chờ duyệt':'Từ chối'}</span></td><td><button class="small" onclick="approvePartner(${p.id},'approved')">Phê duyệt</button> <button class="small danger" onclick="approvePartner(${p.id},'rejected')">Từ chối</button></td></tr>`).join('')||'<tr><td colspan="7">Không có hồ sơ cần xử lý.</td></tr>'}</table></div>`}
if(activeAdminTab==='users')return `<h2>Danh sách người dùng</h2><div class="tablewrap"><table><tr><th>Họ tên</th><th>Email</th><th>Số điện thoại</th><th>Vai trò</th><th>Trạng thái</th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.role==='partner'?'Đối tác':u.role==='customer'?'Khách hàng':'Chưa chọn'}</td><td><span class="status">Hoạt động</span></td></tr>`).join('')||'<tr><td colspan="5">Chưa có người dùng.</td></tr>'}</table></div>`;
if(activeAdminTab==='reviews')return `<h2>Đánh giá chờ kiểm duyệt</h2>${reviews.filter(r=>!r.approved).map(r=>`<div class="panel"><b>${esc(r.name)}</b> · ${'★'.repeat(r.stars)}<p>${esc(r.text)}</p><button onclick="moderateReview(${r.id},true)">Phê duyệt</button> <button class="danger" onclick="moderateReview(${r.id},false)">Bác bỏ</button></div>`).join('')||'<p class="muted">Không có đánh giá chờ duyệt.</p>'}`;
if(activeAdminTab==='services')return `<h2>Danh mục dịch vụ</h2><p class="muted">Các danh mục chuẩn để đối tác lựa chọn.</p><div class="grid">${['Spa & Grooming','Khám chữa bệnh','Trông giữ','Huấn luyện'].map((c,i)=>`<div class="card"><div class="cardbody"><h3>${['🛁','🩺','🏡','🎾','🚗'][i]} ${c}</h3><p class="muted tiny">${services.filter(s=>s.category===c).length} dịch vụ đang có</p></div></div>`).join('')}</div><div class="notice">Trong bản demo, danh mục mẫu đã được tạo sẵn. Thêm/sửa danh mục mới cần kết nối cơ sở dữ liệu ở phiên bản đầy đủ.</div>`;
return `<h2>Trung tâm khiếu nại</h2><p>Giao diện tiếp nhận khiếu nại về chất lượng dịch vụ, thanh toán hoặc thái độ phục vụ sẽ được kết nối với hệ thống phiếu hỗ trợ trong bản triển khai backend.</p><div class="field"><label>Mô tả khiếu nại demo</label><textarea id="complaintText" placeholder="Nhập nội dung để minh họa quy trình..."></textarea></div><button style="margin-top:10px" onclick="toast('Đã ghi nhận minh họa. Phiếu khiếu nại chưa được lưu lên máy chủ.')">Tạo phiếu demo</button>`}
function approvePartner(id,status){let p=partners.find(x=>x.id===id);if(p){p.status=status;if(status==='approved'){let has=services.some(s=>s.partner===p.business);if(!has)services.push({id:Date.now(),partner:p.business,category:p.category,name:p.category==='Spa & Grooming'?'Dịch vụ chăm sóc cơ bản':p.category+' cơ bản',price:150000,duration:60,emoji:'🐾',description:p.description,address:p.address,rating:5,approved:true})}persist();renderAdmin();toast(status==='approved'?'Đã phê duyệt đối tác.':'Đã từ chối hồ sơ.')}} 
function moderateReview(id,ok){let r=reviews.find(x=>x.id===id);if(r){if(ok)r.approved=true;else reviews=reviews.filter(x=>x.id!==id);persist();renderAdmin();toast(ok?'Đã duyệt đánh giá.':'Đã bác bỏ đánh giá.')}}
function init(){setHeader();showPage('home')}
init();
</script>
</body>
</html>
